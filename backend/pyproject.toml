[project]
name = "rewindsafe"
version = "0.1.0"
description = "RewindSafe: an autonomous recovery agent that repairs a data incident while preserving today's authority. Built on a reusable ArmorIQ authority runtime."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.32.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "psycopg[binary,pool]==3.2.*",
    "itsdangerous==2.*",
    "httpx==0.28.*",
    "armoriq-sdk==0.6.10",
    "anthropic>=0.69",
    "openai>=1.60",
    "mcp>=1.9",
    "python-dotenv==1.*",
    "cryptography>=44,<51",
    "PyJWT[crypto]>=2.10,<3",
]

[dependency-groups]
dev = [
    "pytest==8.*",
    "pytest-timeout==2.*",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires real ArmorIQ credentials (never silently passes without them)",
]
addopts = "-q -m 'not live'"
timeout = 120

[tool.ruff]
line-length = 110
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rewindsafe"]
