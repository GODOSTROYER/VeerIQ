      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var D = 10;
          var ROW_Y = [262, 366, 470, 574, 678];
          var AFTER = ["$12,400.00", "$1,240.00", "processing", "active", "active"];
          var BAD = [false, false, true, true, true];
          var GLYPHS = "ABCDEFGHJKLMNPRSTUVWXYZ0123456789$#%&*";
          function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

          // Continuity from frame 1: the line enters at y=700 full-bleed and lifts to become the table's top rule.
          tl.fromTo("#rw-rule", { y: 0, scaleX: 1, x: 0 }, { y: -438, x: 140, scaleX: 1640 / 1920, duration: 0.7, ease: "power3.inOut" }, 0);
          tl.set("#rw-rule", { opacity: 0 }, 0.72);
          tl.fromTo("#rw-beam", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.7);
          tl.fromTo("#rw-world", { scale: 1.02 }, { scale: 1, duration: 6, ease: "sine.out" }, 0);
          tl.fromTo("#rw-glow", { opacity: 0.4, scale: 0.9 }, { opacity: 1, scale: 1.1, duration: 5, ease: "sine.inOut" }, 0);

          // Header and rows arrive (waterfall from below: binary opacity, shrinking gaps).
          tl.fromTo("#rw-title", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.6, ease: "power3.out" }, 0.35);
          tl.fromTo("#rw-head", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.55);
          tl.fromTo("#rw-restore", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 0.6);
          [0, 1, 2, 3, 4].forEach(function (i) {
            var t = 0.6 + i * 0.075;
            tl.set("#rw-r" + i, { opacity: 1, y: 60 - i * 6 }, t);
            tl.to("#rw-r" + i, { y: 0, duration: 0.32, ease: "power4.out" }, t);
          });
          gsap.set(".rw-row", { opacity: 0 });
          gsap.set(".rw-chip", { opacity: 0, scale: 0 });

          // The restore fires: the pill presses on the downbeat, the beam starts at the top rule.
          tl.to("#rw-restore", { scale: 0.92, duration: 0.08, ease: "power2.in" }, 1.85);
          tl.to("#rw-restore", { scale: 1, backgroundColor: "rgba(232,96,44,0.22)", duration: 0.35, ease: "power3.out" }, 1.93);

          // Beam steps row by row on the beat; timecode rewinds 38h03m across the descent.
          var beam = { y: 0 };
          var tagEl = document.getElementById("rw-restore");
          var START_MIN = 38 * 60 + 3;
          function stampAt(p) {
            var m = Math.round(START_MIN * (1 - p));
            var day = m >= 24 * 60 ? "06" : "05";
            var mm = m % (24 * 60), h = Math.floor(mm / 60), mi = mm % 60;
            return "◀◀  REWIND  10-" + day + " " + (h < 10 ? "0" + h : h) + ":" + (mi < 10 ? "0" + mi : mi) + "Z";
          }
          var STOPS = [0, 104, 208, 312, 416, 520];
          for (var s = 0; s < 5; s++) {
            tl.to(beam, { y: STOPS[s + 1], duration: 0.34, ease: "power3.inOut",
              onUpdate: function () {
                document.getElementById("rw-beam").style.transform = "translateY(" + beam.y.toFixed(2) + "px)";
                tagEl.textContent = beam.y >= 519.5 ? "✓  RESTORED SNAP-2026-10-05" : (beam.y <= 0.01 ? "◀◀  RESTORE SNAP-2026-10-05" : stampAt(beam.y / 520));
              } }, 2.0 + s * 0.5);
          }

          // Each row reverts as the beam crosses it: the value cell flips and decodes to the snapshot value.
          [0, 1, 2, 3, 4].forEach(function (i) {
            var t0 = 2.0 + i * 0.5 + 0.12;
            var cell = document.getElementById("rw-v" + i);
            var txt = cell.querySelector(".t");
            var ghosts = cell.querySelectorAll(".g");
            var before = txt.textContent, target = AFTER[i];
            var st = { p: 0 };
            tl.to(st, { p: 1, duration: 0.42, ease: "power3.out", onUpdate: function () {
              var p = st.p;
              if (p <= 0) { txt.textContent = before; cell.style.transform = "rotateX(0deg)"; cell.style.color = "#f2f1ed"; return; }
              var shown = Math.floor(p * 1.25 * target.length);
              var step = Math.floor(p * 14);
              var out = "";
              for (var c = 0; c < target.length; c++) {
                out += c < shown ? target[c] : GLYPHS[Math.floor(hash(i * 100 + c * 7 + step) * GLYPHS.length)];
              }
              txt.textContent = out;
              cell.style.transform = "rotateX(" + (p < 0.6 ? (1 - p / 0.6) * 80 : 0).toFixed(1) + "deg)";
              cell.style.color = BAD[i] ? "#ffa185" : "#a3ccb3";
              for (var g = 0; g < ghosts.length; g++) ghosts[g].textContent = txt.textContent;
            } }, t0);
            gsap.set(cell, { color: "#f2f1ed" });
            tl.fromTo("#rw-c" + i, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.42, ease: "power3.out" }, t0 + 0.24);
            if (BAD[i]) {
              // The wrong ones flare, then hold a warning tint; their values glitch and snap clean.
              var bg = "#rw-r" + i + " .rw-row-bg";
              tl.fromTo(bg, { opacity: 0 }, { opacity: 0.2, duration: 0.05, ease: "none" }, t0 + 0.1);
              tl.to(bg, { opacity: 0.07, duration: 0.5, ease: "power2.out" }, t0 + 0.15);
              var amp = { a: 0 };
              gsap.set(ghosts, { opacity: 0 });
              tl.set(ghosts, { opacity: 0.85 }, t0 + 0.3);
              tl.fromTo(amp, { a: 1 }, { a: 0, duration: 0.3, ease: "power3.in", immediateRender: false, onUpdate: function () {
                var stp = Math.floor(tl.time() * 30);
                for (var g = 0; g < ghosts.length; g++) {
                  var jx = (hash(stp * 13 + g * 7 + i) * 2 - 1) * 12 * amp.a;
                  var jy = (hash(stp * 29 + g * 11 + i) * 2 - 1) * 4 * amp.a;
                  ghosts[g].style.transform = "translate(" + jx.toFixed(1) + "px," + jy.toFixed(1) + "px)";
                }
              } }, t0 + 0.3);
              tl.set(ghosts, { opacity: 0, x: 0, y: 0 }, t0 + 0.61);
            }
          });

          // Push the ledger back (rack focus) and land the headline in front.
          tl.to("#rw-table", { "--dof": "7px", opacity: 0.3, scale: 0.955, duration: 0.8, ease: "power2.inOut" }, 5.6);
          var hw = document.querySelectorAll("#rw-hl1 .w");
          gsap.set("#rw-headline .w", { opacity: 0 });
          for (var k = 0; k < hw.length; k++) {
            var tk = 6.0 + k * 0.13;
            tl.set(hw[k], { opacity: 1, y: [70, 45, 60][k] }, tk);
            tl.to(hw[k], { y: 0, duration: [0.2, 0.14, 0.18][k], ease: "power4.out" }, tk);
          }
          var hw2 = document.querySelectorAll("#rw-hl2 .w");
          for (var q = 0; q < hw2.length; q++) {
            var tq = 6.55 + q * 0.12;
            tl.fromTo(hw2[q], { opacity: 0, x: 90, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, tq);
          }
          tl.fromTo("#rw-headline", { x: 0 }, { x: 18, duration: 3, ease: "sine.inOut" }, 6.5);

          var CAP = "A backup can't tell damage from a decision.";
          var capEl = document.getElementById("rw-cap");
          var cs = { v: 0 };
          tl.to(cs, { v: CAP.length, duration: 0.9, ease: "none", onUpdate: function () {
            var s = CAP.substring(0, Math.floor(cs.v));
            capEl.innerHTML = s.replace("damage", '<span class="d1">damage</span>').replace("a decision", 'a <span class="d2">decision</span>');
          } }, 7.6);

          // Transition out: the frame collapses into one hot line (CRT off) that the next scene opens from.
          tl.fromTo("#rw-world", { scaleY: 1, scaleX: 1, filter: "brightness(1)" }, { scaleY: 0.004, scaleX: 1.04, filter: "brightness(2.2)", duration: 0.32, ease: "power3.in", immediateRender: false }, 9.62);
          tl.fromTo("#rw-flash", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.in", immediateRender: false }, 9.66);

          window.__timelines["rewind"] = tl;
        })();
      </script>
