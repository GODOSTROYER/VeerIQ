          // Shards: a fixed pool thrown back from the wall, pure ballistic function of time.
          var field = document.getElementById("at-parts"), parts = [];
          var COLS = ["#ffa185", "#e8602c", "#f2f1ed", "#ff8050"];
          for (var i = 0; i < 36; i++) {
            var el = document.createElement("div"); el.className = "at-p";
            var w = 6 + hash(i * 3 + 1) * 22, h = 4 + hash(i * 5 + 2) * 8;
            el.style.width = w.toFixed(1) + "px"; el.style.height = h.toFixed(1) + "px"; el.style.background = COLS[i % 4];
            field.appendChild(el);
            var ang = Math.PI + (hash(i * 7 + 3) * 2 - 1) * 1.05, sp = 380 + hash(i * 11 + 4) * 900;
            parts.push({ el: el, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 120, spin: (hash(i * 13 + 5) * 2 - 1) * 720 });
          }
          var drv = { T: 0 }, FL = 1.1;
          tl.fromTo(drv, { T: 0 }, { T: 1, duration: FL, ease: "none", immediateRender: false, onUpdate: function () {
            var t = drv.T * FL, fade = Math.min(1, (1 - drv.T) / 0.35);
            parts.forEach(function (p) {
              var x = p.vx * t * (1 - 0.35 * drv.T), y = p.vy * t + 0.5 * 900 * t * t;
              p.el.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (p.spin * t).toFixed(0) + "deg)";
              p.el.style.opacity = drv.T <= 0 ? "0" : fade.toFixed(3);
            });
          } }, IMPACT);
          tl.set(".at-p", { opacity: 0 }, IMPACT + FL + 0.01);
          tl.set("#at-parts", { opacity: 1 }, IMPACT - 0.01);

          // Verdict: the stamp slams, RGB copies shudder, then snap clean.
          tl.fromTo("#at-stamp-wrap", { opacity: 0, scale: 1.7, rotation: -3 }, { opacity: 1, scale: 1, rotation: -3, duration: 0.18, ease: "expo.out", immediateRender: false }, IMPACT + 0.04);
          var g1 = document.getElementById("at-sg1"), g2 = document.getElementById("at-sg2");
          gsap.set([g1, g2], { opacity: 0 });
          tl.set([g1, g2], { opacity: 1 }, IMPACT + 0.04);
          var ga = { a: 1 };
          tl.fromTo(ga, { a: 1 }, { a: 0, duration: 0.42, ease: "power3.in", immediateRender: false, onUpdate: function () {
            var k = Math.floor(tl.time() * 24);
            g1.style.transform = "translate(" + ((hash(k * 13 + 1) * 2 - 1) * 26 * ga.a).toFixed(1) + "px," + ((hash(k * 29 + 2) * 2 - 1) * 8 * ga.a).toFixed(1) + "px)";
            g2.style.transform = "translate(" + ((hash(k * 17 + 3) * 2 - 1) * 26 * ga.a).toFixed(1) + "px," + ((hash(k * 31 + 4) * 2 - 1) * 8 * ga.a).toFixed(1) + "px)";
          } }, IMPACT + 0.04);
          tl.set([g1, g2], { opacity: 0, x: 0, y: 0 }, IMPACT + 0.47);
          // Second, smaller spasm on the next beat.
          tl.set([g1, g2], { opacity: 0.9 }, IMPACT + 0.5);
          var gb = { a: 1 };
          tl.fromTo(gb, { a: 1 }, { a: 0, duration: 0.16, ease: "power3.in", immediateRender: false, onUpdate: function () {
            var k = Math.floor(tl.time() * 24);
            g1.style.transform = "translate(" + ((hash(k * 5 + 9) * 2 - 1) * 14 * gb.a).toFixed(1) + "px,0px)";
            g2.style.transform = "translate(" + ((hash(k * 9 + 7) * 2 - 1) * 14 * gb.a).toFixed(1) + "px,0px)";
          } }, IMPACT + 0.5);
          tl.set([g1, g2], { opacity: 0 }, IMPACT + 0.67);

          var WHY = "armoriq.sdk.plan_binding — not in the signed plan.";
          var whyEl = document.getElementById("at-why"), ws = { v: 0 };
          tl.to(ws, { v: WHY.length, duration: 0.7, ease: "none", onUpdate: function () {
            var s = WHY.substring(0, Math.floor(ws.v));
            whyEl.innerHTML = s.length <= 24 ? "<b>" + esc(s) + "</b>" : "<b>" + esc(s.substring(0, 24)) + "</b>" + esc(s.substring(24));
          } }, IMPACT + 0.45);
          tl.fromTo("#at-why", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, IMPACT + 0.44);
          tl.fromTo("#at-never", { opacity: 0, y: 30, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "expo.out", immediateRender: false }, IMPACT + 1.2);
          ["#at-af1", "#at-af2", "#at-af3"].forEach(function (id, i) {
            tl.fromTo(id, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, IMPACT + 1.5 + i * 0.14);
          });
          tl.fromTo("#at-after", { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: false }, IMPACT + 1.49);
          tl.fromTo("#at-count", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, IMPACT + 2.3);
          tl.fromTo("#at-stamp-wrap", { scale: 1 }, { scale: 1.03, duration: 3.4, ease: "sine.out", immediateRender: false }, IMPACT + 0.25);

          window.__timelines["attack"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
