      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var D = 6;

          // Background: hairline columns drop in, ghost incident id drifts, slow push on the world.
          tl.fromTo(".hook-gridline", { scaleY: 0 }, { scaleY: 1, duration: 0.9, ease: "power2.out", stagger: 0.025 }, 0.05);
          tl.fromTo("#hook-ghost", { x: 60, opacity: 0 }, { x: -120, opacity: 1, duration: D, ease: "none" }, 0);
          tl.fromTo("#hook-world", { scale: 1 }, { scale: 1.035, duration: D, ease: "sine.inOut" }, 0);

          // The incident stamp types on (smooth slice), caret blinks on the timeline.
          var STAMP = "INC-4471   2026-10-05 02:14:00Z   migration:2026_10_05_fx_rounding";
          var stampEl = document.getElementById("hook-stamp-text");
          var sl = { v: 0 };
          tl.to(sl, { v: STAMP.length, duration: 1.0, ease: "power1.inOut", onUpdate: function () {
            var s = STAMP.substring(0, Math.floor(sl.v));
            stampEl.innerHTML = s.length > 8 ? "<b>" + s.substring(0, 8) + "</b>" + s.substring(8) : "<b>" + s + "</b>";
          } }, 0.3);
          var cur = document.getElementById("hook-cursor");
          var bl = { p: 0 };
          tl.to(bl, { p: Math.PI * 2 * 9, duration: D, ease: "none", onUpdate: function () { cur.style.opacity = Math.sin(bl.p) > -0.2 ? "1" : "0"; } }, 0);

          // THE LINE draws edge to edge; its hot head and glow ride the same ease.
          tl.fromTo("#hook-line", { scaleX: 0 }, { scaleX: 1, duration: 1.05, ease: "expo.inOut" }, 0.45);
          tl.fromTo("#hook-head", { x: 0, opacity: 1 }, { x: 1920, duration: 1.05, ease: "expo.inOut" }, 0.45);
          tl.fromTo("#hook-glow", { x: 0, opacity: 0 }, { x: 1500, opacity: 1, duration: 1.05, ease: "expo.inOut" }, 0.45);
          tl.to("#hook-glow", { scale: 1.12, opacity: 0.75, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.6);

          // Words rise from behind the line (masked slide-up), a cascade that overlaps.
          tl.fromTo("#hook-w1", { yPercent: 108 }, { yPercent: 0, duration: 0.55, ease: "power4.out" }, 1.0);
          tl.fromTo("#hook-w2", { yPercent: 112 }, { yPercent: 0, duration: 0.62, ease: "expo.out" }, 1.08);
          tl.fromTo("#hook-w3", { yPercent: 118 }, { yPercent: 0, duration: 0.6, ease: "power4.out" }, 1.36);
          tl.fromTo("#hook-w4", { yPercent: 125 }, { yPercent: 0, duration: 0.52, ease: "expo.out" }, 1.5);
          tl.fromTo("#hook-r1, #hook-r2", { x: 0 }, { x: 26, duration: 2.3, ease: "sine.inOut" }, 1.6);

          // Readout column: rules draw, values clip in from the left.
          ["#hook-ro1", "#hook-ro2", "#hook-ro3", "#hook-ro4"].forEach(function (id, i) {
            tl.fromTo(id, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, 1.75 + i * 0.09);
          });

          // HARD CUT on the bar (t=4): the line of type is gone; one word slams.
          tl.set("#hook-m1, #hook-m2, #hook-readout", { opacity: 0 }, 4.0);
          gsap.set("#hook-every-wrap", { opacity: 1 });
          tl.fromTo("#hook-every", { opacity: 0, scale: 1.2, filter: "blur(16px)" },
            { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.24, ease: "expo.out", immediateRender: true }, 4.0);
          // Chromatic split: offset copies jitter on quantized time, then snap clean.
          var r = document.getElementById("hook-every-r"), b = document.getElementById("hook-every-b");
          gsap.set([r, b], { opacity: 0 });
          var gl = { t: 0 };
          tl.to(gl, { t: 1, duration: 0.3, ease: "none", onUpdate: function () {
            var k = Math.floor(gl.t * 12), amp = (1 - gl.t) * 22;
            var j = ((k * 37) % 11) / 11 - 0.5;
            r.style.opacity = gl.t < 1 ? "1" : "0"; b.style.opacity = gl.t < 1 ? "1" : "0";
            r.style.transform = "translate(" + (amp * (0.6 + j)).toFixed(1) + "px," + (j * 6).toFixed(1) + "px)";
            b.style.transform = "translate(" + (-amp * (0.7 - j)).toFixed(1) + "px," + (-j * 5).toFixed(1) + "px)";
          } }, 4.0);
          tl.set([r, b], { opacity: 0 }, 4.31);
          // The line takes the hit: a thick flash, then settles. One impact frame.
          tl.fromTo("#hook-line", { scaleY: 1 }, { scaleY: 5, duration: 0.06, ease: "none", immediateRender: false }, 4.0);
          tl.to("#hook-line", { scaleY: 1, duration: 0.5, ease: "expo.out" }, 4.06);
          tl.fromTo("#hook-flash", { opacity: 0 }, { opacity: 0.2, duration: 0.04, ease: "none", immediateRender: false }, 4.0);
          tl.to("#hook-flash", { opacity: 0, duration: 0.22, ease: "power2.out" }, 4.04);
          tl.fromTo("#hook-world", { y: 0 }, { y: 10, duration: 0.05, ease: "none", immediateRender: false }, 4.0);
          tl.to("#hook-world", { y: 0, duration: 0.4, ease: "elastic.out(1, 0.4)" }, 4.05);

          // The subline types under the line.
          var SUB = "— including every decision you made after it.";
          var subEl = document.getElementById("hook-sub");
          var ss = { v: 0 };
          tl.to(ss, { v: SUB.length, duration: 0.85, ease: "none", onUpdate: function () {
            var s = SUB.substring(0, Math.floor(ss.v));
            subEl.innerHTML = s.replace("every decision", "<b>every decision</b>");
          } }, 4.55);

          window.__timelines["hook"] = tl;
        })();
      </script>
