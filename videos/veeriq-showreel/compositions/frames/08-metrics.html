      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var world = document.getElementById("mt-world");
          var S = 2.2;
          var STOPS = { A: [-184, -164], B: [-2120, -164], C: [-184, -1132], D: [-2120, -1132] };
          var cam = { s: S, x: STOPS.A[0], y: STOPS.A[1] };
          function apply() { world.style.transform = "translate(" + cam.x.toFixed(2) + "px," + cam.y.toFixed(2) + "px) scale(" + cam.s.toFixed(4) + ")"; }
          apply();
          function move(to, t, d) { tl.to(cam, { x: to[0], y: to[1], duration: d || 0.55, ease: "power3.inOut", onUpdate: apply }, t); }

          var grid = document.getElementById("mt-grid");
          for (var q = 0; q < 24; q++) { var sq = document.createElement("div"); sq.className = "mt-sq"; sq.innerHTML = "<i></i>"; grid.appendChild(sq); }
          var fills = grid.querySelectorAll("i");
          gsap.set(fills, { scale: 0 });

          // A — zero, struck through.
          tl.fromTo("#mt-a0", { scale: 1.5, opacity: 0, filter: "blur(14px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "expo.out" }, 0.12);
          tl.fromTo("#mt-alab", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.4);
          var a84 = document.getElementById("mt-a84"), ac = { v: 0 };
          tl.to(ac, { v: 84, duration: 1.1, ease: "power3.out", onUpdate: function () { a84.textContent = Math.round(ac.v); } }, 0.4);
          tl.fromTo("#mt-A .mt-arow", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", stagger: 0.1 }, 0.7);
          tl.fromTo("#mt-A .mt-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out", stagger: 0.12 }, 1.05);

          // B — 18 of 24, every filled square a completed repair.
          move(STOPS.B, 2.2);
          var b18 = document.getElementById("mt-b18"), bc = { v: 0 };
          tl.to(bc, { v: 18, duration: 1.2, ease: "power3.out", onUpdate: function () { b18.textContent = Math.round(bc.v); } }, 2.62);
          tl.fromTo("#mt-b18", { scale: 0.6, transformOrigin: "0% 80%" }, { scale: 1, duration: 1.2, ease: "power3.out" }, 2.62);
          tl.fromTo("#mt-b24", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 3.82);
          tl.fromTo("#mt-grid .mt-sq", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.012 }, 2.5);
          for (var f = 0; f < 18; f++) tl.to(fills[f], { scale: 1, duration: 0.18, ease: "power3.out" }, 2.65 + 1.1 * (1 - Math.pow(1 - (f + 1) / 18, 0.6)) - 0.05);
          tl.fromTo("#mt-blab", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.0);

          // C — a signed plan that still could not override policy.
          move(STOPS.C, 4.4, 0.62);
          tl.fromTo("#mt-ch", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power4.out" }, 4.85);
          tl.fromTo("#mt-cc1", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 5.2);
          tl.fromTo("#mt-carrow", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 5.5);
          tl.fromTo("#mt-cc2", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out" }, 5.65);
          tl.fromTo("#mt-csub", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 5.95);

          // D — tests, counting as a chord.
          move(STOPS.D, 6.6);
          var d1 = document.getElementById("mt-d1"), d2 = document.getElementById("mt-d2"), dc = { v: 0 };
          tl.to(dc, { v: 1, duration: 1.2, ease: "power3.out", onUpdate: function () { d1.textContent = Math.round(532 * dc.v); d2.textContent = Math.round(204 * dc.v); } }, 7.0);
          tl.fromTo("#mt-dlab", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.3);
          tl.fromTo("#mt-D .mt-dchip", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out", stagger: 0.07 }, 7.6);

          // Pull back: all four results on one board.
          tl.to(cam, { s: 1, x: 0, y: 0, duration: 1.0, ease: "power3.inOut", onUpdate: apply }, 8.35);
          tl.fromTo("#mt-over", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 9.1);
          tl.fromTo(".mt-cell", { borderColor: "rgba(242,241,237,0.12)" }, { borderColor: "rgba(232,96,44,0.45)", duration: 0.5, ease: "power2.out", stagger: 0.06, immediateRender: false }, 9.0);

          // Exit: zoom out into the next frame.
          tl.fromTo("#mt-cam", { scale: 1, filter: "blur(0px)" }, { scale: 0.86, filter: "blur(12px)", duration: 0.25, ease: "power3.in", immediateRender: false }, 9.75);

          window.__timelines["metrics"] = tl;
        })();
