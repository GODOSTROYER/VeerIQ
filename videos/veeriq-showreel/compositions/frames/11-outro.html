      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

          // Out of the dissolve: the confession rises, then the verdict slams on the bar.
          tl.fromTo("#ou-glow", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 2.4, ease: "sine.out" }, 0);
          tl.fromTo("#ou-s1", { yPercent: 104 }, { yPercent: 0, duration: 0.8, ease: "expo.out" }, 0.25);
          var SLAM = 2.0;
          tl.fromTo("#ou-s2", { opacity: 0, scale: 1.25, filter: "blur(16px)", transformOrigin: "0% 70%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out" }, SLAM);
          var r = document.getElementById("ou-s2r"), b = document.getElementById("ou-s2b");
          gsap.set([r, b], { opacity: 0 });
          tl.set([r, b], { opacity: 1 }, SLAM);
          var ga = { a: 1 };
          tl.fromTo(ga, { a: 1 }, { a: 0, duration: 0.36, ease: "power3.in", immediateRender: false, onUpdate: function () {
            var k = Math.floor(tl.time() * 24);
            r.style.transform = "translate(" + ((hash(k * 13 + 1) * 2 - 1) * 22 * ga.a).toFixed(1) + "px," + ((hash(k * 7 + 2) * 2 - 1) * 6 * ga.a).toFixed(1) + "px)";
            b.style.transform = "translate(" + ((hash(k * 17 + 3) * 2 - 1) * 22 * ga.a).toFixed(1) + "px," + ((hash(k * 11 + 4) * 2 - 1) * 6 * ga.a).toFixed(1) + "px)";
          } }, SLAM);
          tl.set([r, b], { opacity: 0, x: 0, y: 0 }, SLAM + 0.37);
          // The line draws beneath the verdict, edge to edge — the same line as the first frame.
          tl.fromTo("#ou-line", { scaleX: 0, x: 0, y: 0 }, { scaleX: 1, x: 0, y: 0, duration: 0.6, ease: "expo.out" }, SLAM);
          tl.fromTo("#ou-world", { y: 0 }, { y: 9, duration: 0.05, ease: "none", immediateRender: false }, SLAM);
          tl.to("#ou-world", { y: 0, duration: 0.45, ease: "elastic.out(1, 0.4)" }, SLAM + 0.05);

          // Statement clears; the line slides up and narrows into the wordmark's underline.
          tl.to("#ou-st", { y: -70, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 3.7);
          tl.to("#ou-line", { y: -113, x: 470, scaleX: 980 / 1920, duration: 0.75, ease: "power3.inOut" }, 3.85);

          // Lockup assembles over its underline.
          var shield = document.getElementById("ou-shield"), chev = document.getElementById("ou-chev");
          var L1 = shield.getTotalLength() * 1.04, L2 = chev.getTotalLength() * 1.04;
          shield.style.strokeDasharray = L1; chev.style.strokeDasharray = L2;
          gsap.set([shield, chev], { opacity: 0 });
          tl.set(shield, { opacity: 1 }, 4.35);
          tl.set(chev, { opacity: 1 }, 4.85);
          tl.fromTo(shield, { strokeDashoffset: L1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 4.35);
          tl.fromTo(chev, { strokeDashoffset: L2 }, { strokeDashoffset: 0, duration: 0.38, ease: "power2.out" }, 4.85);
          var letters = document.querySelectorAll("#ou-wm span");
          gsap.set(letters, { opacity: 0 });
          for (var i = 0; i < letters.length; i++) {
            var t = 4.55 + i * 0.06;
            tl.set(letters[i], { opacity: 1, x: -150 - i * 10 }, t);
            tl.to(letters[i], { x: 0, duration: 0.5, ease: "expo.out" }, t);
          }
          tl.fromTo("#ou-tag", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 5.15);
          tl.fromTo("#ou-meta span", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.09 }, 5.5);
          tl.fromTo("#ou-world", { scale: 1 }, { scale: 1.03, duration: 3.4, ease: "sine.inOut", immediateRender: false }, 4.3);

          // Final scene: fade to black.
          tl.fromTo("#ou-black", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.in" }, 7.4);

          window.__timelines["outro"] = tl;
        })();
      </script>
