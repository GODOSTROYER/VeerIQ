<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="surgical-template">
      <style>
        @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("../../assets/fonts/InstrumentSerif-normal-400.woff2") format("woff2"); }
        @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("../../assets/fonts/InstrumentSerif-italic-400.woff2") format("woff2"); }
        @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("../../assets/fonts/GeistMono-normal-100-900.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; background: #0e0e10; color: #f2f1ed; }
        #sg-world { position: absolute; inset: 0; transform-origin: 50% 50%; }
        #sg-glow { position: absolute; left: 960px; top: 560px; width: 1700px; height: 900px; margin: -450px 0 0 -850px; border-radius: 50%; background: radial-gradient(ellipse, rgba(163,204,179,0.10) 0%, rgba(163,204,179,0) 60%); }
        #sg-top { position: absolute; left: 140px; top: 214px; width: 1640px; height: 2px; background: #e8602c; transform-origin: 0 50%; }
        #sg-title { position: absolute; left: 140px; top: 168px; font-family: "Geist Mono", monospace; font-size: 22px; letter-spacing: 0.14em; color: #e8602c; white-space: nowrap; }
        #sg-title span { color: #aaa9a7; }
        #sg-pill { position: absolute; right: 140px; top: 160px; padding: 6px 14px; border: 2px solid rgba(163,204,179,0.6); font-family: "Geist Mono", monospace; font-size: 18px; letter-spacing: 0.12em; color: #a3ccb3; white-space: pre; }
        /* The damaged totals: repaired in place, nothing else touched. */
        #sg-prices { position: absolute; left: 140px; top: 252px; display: flex; gap: 22px; align-items: center; }
        .sg-p { position: relative; width: 360px; padding: 16px 24px 18px; border: 2px solid rgba(255,161,133,0.55); background: #151517; font-family: "Geist Mono", monospace; overflow: hidden; }
        .sg-p span { display: block; font-size: 15px; letter-spacing: 0.14em; color: #aaa9a7; }
        .sg-p b { display: block; margin-top: 6px; font-size: 44px; font-weight: 500; color: #ffa185; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .sg-hl { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: rgba(163,204,179,0.10); transform-origin: 0 50%; }
        .sg-chip { position: absolute; right: 16px; top: 14px; padding: 3px 8px; background: #a3ccb3; color: #0e0e10; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; }
        #sg-scalpel { position: absolute; left: 140px; top: 244px; width: 4px; height: 110px; background: #e8602c; box-shadow: 0 0 22px 4px rgba(255,128,80,0.7); transform-origin: 50% 0%; }
        #sg-note { font-family: "Geist Mono", monospace; font-size: 18px; line-height: 28px; color: #aaa9a7; white-space: nowrap; padding-left: 8px; }
        #sg-note b { color: #f2f1ed; font-weight: 500; }
        /* What the backup brought back stays exactly where people left it. */
        #sg-cards { position: absolute; left: 140px; top: 420px; display: flex; gap: 20px; }
        .sg-c { position: relative; width: 533px; height: 228px; padding: 24px 30px; background: #151517; border: 2px solid rgba(163,204,179,0.4); border-left: 6px solid #a3ccb3; }
        .sg-c .k { display: flex; justify-content: space-between; align-items: center; font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: 0.14em; color: #aaa9a7; }
        .sg-c .k b { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; background: #a3ccb3; color: #0e0e10; font-weight: 700; letter-spacing: 0.1em; }
        .sg-c .t { margin-top: 22px; font-family: "Instrument Serif", serif; font-size: 48px; line-height: 54px; letter-spacing: -0.02em; color: #f2f1ed; }
        .sg-c .t i { color: #a3ccb3; }
        .sg-lock { width: 16px; height: 16px; }
        #sg-hl-wrap { position: absolute; left: 140px; top: 704px; }
        .sg-hl-mask { overflow: hidden; height: 108px; }
        .sg-hlt { font-family: "Instrument Serif", serif; font-size: 100px; line-height: 108px; letter-spacing: -0.03em; word-spacing: 0.04em; white-space: nowrap; }
        #sg-hl2 { font-style: italic; color: #e8602c; }
      </style>
      <div id="root" data-composition-id="surgical" data-width="1920" data-height="1080">
        <div id="sg-world">
          <div id="sg-glow" data-layout-ignore></div>
          <div id="sg-title">VEERIQ REPAIR&nbsp;&nbsp;<span>·&nbsp;&nbsp;VALUES FROM THE APPROVED SNAPSHOT</span></div>
          <div id="sg-pill">REPAIRED 0/2  ·  KEPT 0/3</div>
          <div id="sg-top"></div>

          <div id="sg-prices">
            <div class="sg-p" id="sg-p0"><div class="sg-hl" id="sg-hl0"></div><span>ORDER TOTAL</span><b id="sg-v0">$0.00</b><div class="sg-chip" id="sg-c0">✓ REPAIRED</div></div>
            <div class="sg-p" id="sg-p1"><div class="sg-hl" id="sg-hl1"></div><span>ORDER TOTAL</span><b id="sg-v1">$0.00</b><div class="sg-chip" id="sg-c1">✓ REPAIRED</div></div>
            <div id="sg-note">only the damaged fields,<br /><b>from the approved snapshot</b></div>
          </div>
          <div id="sg-scalpel"></div>

          <div id="sg-cards">
            <div class="sg-c" id="sg-k0"><div class="k">CUSTOMER<b><svg class="sg-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" fill="none" stroke="#0e0e10" stroke-width="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="#0e0e10" stroke-width="3"/></svg>KEPT</b></div><div class="t">The deleted customer <i>stays deleted.</i></div></div>
            <div class="sg-c" id="sg-k1"><div class="k">ACCESS<b><svg class="sg-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" fill="none" stroke="#0e0e10" stroke-width="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="#0e0e10" stroke-width="3"/></svg>KEPT</b></div><div class="t">The revoked account <i>stays revoked.</i></div></div>
            <div class="sg-c" id="sg-k2"><div class="k">ORDER<b><svg class="sg-lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" fill="none" stroke="#0e0e10" stroke-width="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="#0e0e10" stroke-width="3"/></svg>KEPT</b></div><div class="t">The shipped order <i>stays shipped.</i></div></div>
          </div>

          <div id="sg-hl-wrap">
            <div class="sg-hl-mask"><div class="sg-hlt" id="sg-hl1t">Repairs only the damage.</div></div>
            <div class="sg-hl-mask"><div class="sg-hlt" id="sg-hl2">Keeps every later decision.</div></div>
          </div>
        </div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var GLYPHS = "0123456789$,.#%";
          function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
          // Arrive from below, velocity-matched to the previous frame's push up.
          tl.fromTo("#sg-world", { y: 170, filter: "blur(10px)" }, { y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo("#sg-top", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "expo.inOut" }, 0.05);
          tl.fromTo("#sg-title", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.55, ease: "power3.out" }, 0.25);
          tl.fromTo("#sg-pill", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 0.35);
          tl.fromTo("#sg-glow", { opacity: 0 }, { opacity: 1, duration: 2, ease: "sine.inOut" }, 0.6);
          tl.fromTo("#sg-prices", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.4);
          gsap.set(".sg-chip", { opacity: 0, scale: 0 });
          gsap.set(".sg-hl", { scaleX: 0 });
          gsap.set("#sg-scalpel", { opacity: 0, scaleY: 0 });
          gsap.set("#sg-cards, .sg-c", { opacity: 0 });
          var pill = document.getElementById("sg-pill");
          function pillText(c, d) { pill.textContent = "REPAIRED " + c + "/2  ·  KEPT " + d + "/3"; }

          // The scalpel: one short cut of the line, visiting only the two damaged totals.
          tl.to("#sg-scalpel", { opacity: 1, scaleY: 1, duration: 0.22, ease: "expo.out" }, 0.75);
          var AFTER = ["$12,400.00", "$1,240.00"];
          [0, 1].forEach(function (i) {
            var t0 = 0.95 + i * 0.62;
            if (i > 0) tl.to("#sg-scalpel", { x: 382 * i, duration: 0.13, ease: "power3.inOut" }, t0 - 0.15);
            tl.to("#sg-hl" + i, { scaleX: 1, duration: 0.42, ease: "power2.out" }, t0);
            tl.to("#sg-scalpel", { x: 382 * i + 300, duration: 0.42, ease: "power2.out" }, t0);
            tl.set("#sg-scalpel", { x: 382 * i }, t0 + 0.45);
            var cell = document.getElementById("sg-v" + i), target = AFTER[i], st = { p: 0 };
            tl.to(st, { p: 1, duration: 0.45, ease: "power3.out", onUpdate: function () {
              var p = st.p;
              if (p <= 0) { cell.textContent = "$0.00"; cell.style.color = "#ffa185"; return; }
              var shown = Math.floor(p * 1.3 * target.length), step = Math.floor(p * 14), out = "";
              for (var c = 0; c < target.length; c++) out += c < shown ? target[c] : GLYPHS[Math.floor(hash(i * 50 + c * 3 + step) * GLYPHS.length)];
              cell.textContent = out; cell.style.color = "#a3ccb3";
            } }, t0 + 0.05);
            tl.to("#sg-p" + i, { borderColor: "rgba(163,204,179,0.6)", duration: 0.2, ease: "none" }, t0 + 0.1);
            tl.fromTo("#sg-c" + i, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, t0 + 0.3);
          });
          tl.to("#sg-scalpel", { scaleY: 0, opacity: 0, duration: 0.25, ease: "power3.in" }, 2.05);

          // The three later decisions, the same ones the backup broke, lock in place: kept.
          tl.set("#sg-cards", { opacity: 1 }, 2.15);
          [0, 1, 2].forEach(function (i) {
            var t = 2.2 + i * 0.12;
            tl.fromTo("#sg-k" + i, { opacity: 0, y: 34, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "power3.out", immediateRender: false }, t);
            tl.fromTo("#sg-k" + i + " .k b", { scale: 0, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, t + 0.12);
          });
          // Tally in the pill follows the work.
          var tally = { t: 0 };
          tl.to(tally, { t: 1, duration: 5.4, ease: "none", onUpdate: function () {
            var tt = tally.t * 5.4 + 0.3;
            var c = tt >= 1.87 ? 2 : (tt >= 1.25 ? 1 : 0);
            var d = tt >= 2.56 ? 3 : (tt >= 2.44 ? 2 : (tt >= 2.32 ? 1 : 0));
            pillText(c, d);
          } }, 0.3);
          // The promise lands under the work.
          tl.fromTo("#sg-hl1t", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power4.out" }, 2.7);
          tl.fromTo("#sg-hl2", { yPercent: 105 }, { yPercent: 0, duration: 0.65, ease: "expo.out" }, 3.05);
          tl.fromTo("#sg-world", { scale: 1 }, { scale: 1.025, duration: 4.6, ease: "sine.inOut", immediateRender: false }, 0.55);
          // Whip-pan out to the left; the next frame enters from the right at the same speed.
          tl.to("#sg-world", { x: -420, filter: "blur(18px)", duration: 0.28, ease: "power3.in" }, 5.72);
          window.__timelines["surgical"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
