<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="story-template">
      <style>
        @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("../../assets/fonts/InstrumentSerif-normal-400.woff2") format("woff2"); }
        @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("../../assets/fonts/InstrumentSerif-italic-400.woff2") format("woff2"); }
        @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("../../assets/fonts/GeistMono-normal-100-900.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; background: #0e0e10; color: #f2f1ed; }
        #st-world { position: absolute; inset: 0; transform-origin: 50% 50%; }
        #st-glow { position: absolute; left: 460px; top: 520px; width: 1600px; height: 1000px; margin: -500px 0 0 -800px; border-radius: 50%; background: radial-gradient(ellipse, rgba(232,96,44,0.16) 0%, rgba(232,96,44,0) 62%); }
        .st-hm { position: absolute; left: 140px; width: 1640px; overflow: hidden; }
        .st-h { font-family: "Instrument Serif", serif; letter-spacing: -0.03em; word-spacing: 0.04em; white-space: nowrap; }
        .st-h i { color: #e8602c; }
        .st-q { font-size: 156px; line-height: 164px; }
        .st-m { font-size: 112px; line-height: 120px; }
        #st-stamp { position: absolute; left: 140px; top: 168px; font-family: "Geist Mono", monospace; font-size: 22px; letter-spacing: 0.1em; color: #e8602c; white-space: pre; min-width: 900px; }
        /* Order totals: three prices, not a table. */
        #st-prices { position: absolute; left: 140px; top: 560px; display: flex; gap: 22px; }
        .st-p { width: 330px; padding: 18px 24px 20px; border: 2px solid rgba(242,241,237,0.2); background: #151517; font-family: "Geist Mono", monospace; }
        .st-p span { display: block; font-size: 16px; letter-spacing: 0.14em; color: #aaa9a7; }
        .st-p b { display: block; margin-top: 8px; font-size: 48px; font-weight: 500; color: #f2f1ed; font-variant-numeric: tabular-nums; white-space: nowrap; }
        #st-lost { position: absolute; left: 144px; top: 740px; font-family: "Geist Mono", monospace; font-size: 26px; color: #aaa9a7; white-space: nowrap; }
        #st-lost b { color: #ffa185; font-weight: 600; }
        /* The vermillion line becomes the restore timeline. */
        #st-line { position: absolute; left: 0; top: 858px; width: 1920px; height: 3px; background: #e8602c; transform-origin: 0 50%; }
        .st-mk { position: absolute; top: 878px; font-family: "Geist Mono", monospace; font-size: 18px; letter-spacing: 0.12em; color: #aaa9a7; white-space: nowrap; }
        .st-tick { position: absolute; top: 848px; width: 3px; height: 23px; background: rgba(242,241,237,0.55); }
        #st-play { position: absolute; left: 0; top: 800px; width: 4px; height: 118px; background: #f2f1ed; box-shadow: 0 0 22px 4px rgba(255,128,80,0.7); }
        #st-clock { position: absolute; left: 0; top: 762px; padding: 4px 10px; background: #e8602c; color: #0e0e10; font-family: "Geist Mono", monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.08em; white-space: nowrap; font-variant-numeric: tabular-nums; }
        #st-ok { position: absolute; left: 144px; top: 694px; font-family: "Geist Mono", monospace; font-size: 26px; color: #a3ccb3; white-space: nowrap; }
        /* What came back with them. */
        #st-cards { position: absolute; left: 140px; top: 470px; display: flex; gap: 20px; }
        .st-c { position: relative; width: 533px; height: 330px; padding: 28px 30px; background: #151517; border: 2px solid rgba(255,161,133,0.45); border-left: 6px solid #ffa185; }
        .st-c .k { display: flex; justify-content: space-between; align-items: center; font-family: "Geist Mono", monospace; font-size: 17px; letter-spacing: 0.14em; color: #aaa9a7; }
        .st-c .k b { padding: 4px 10px; background: #ffa185; color: #0e0e10; font-weight: 700; letter-spacing: 0.1em; }
        .st-c .t { margin-top: 26px; font-family: "Instrument Serif", serif; font-size: 50px; line-height: 56px; letter-spacing: -0.02em; color: #f2f1ed; }
        .st-c .t i { color: #ffa185; }
        .st-c .ico { position: absolute; right: 30px; bottom: 26px; width: 44px; height: 44px; }
        #st-flash { position: absolute; left: 0; top: 538px; width: 1920px; height: 4px; background: #fff3ec; opacity: 0; box-shadow: 0 0 30px 8px rgba(255,128,80,0.7); }
        #st-red { position: absolute; inset: 0; background: radial-gradient(circle at 50% 60%, rgba(232,96,44,0.22), rgba(232,96,44,0) 60%); opacity: 0; }
      </style>
      <div id="root" data-composition-id="story" data-width="1920" data-height="1080">
        <div id="st-world">
          <div id="st-glow" data-layout-ignore></div>
          <div id="st-red" data-layout-ignore></div>
          <div id="st-stamp"></div>

          <!-- 1. The question -->
          <div class="st-hm" style="top:296px; height:164px"><div class="st-h st-q" id="st-q1">Ever had to</div></div>
          <div class="st-hm" style="top:460px; height:164px"><div class="st-h st-q" id="st-q2"><i>restore a backup?</i></div></div>

          <!-- 2. The incident -->
          <div class="st-hm" style="top:236px; height:120px"><div class="st-h st-m" id="st-a1">2:14 AM. A bad migration</div></div>
          <div class="st-hm" style="top:356px; height:120px"><div class="st-h st-m" id="st-a2"><i>zeroed your order totals.</i></div></div>
          <div id="st-prices">
            <div class="st-p" id="st-p0"><span>ORDER TOTAL</span><b id="st-v0">$1,240.00</b></div>
            <div class="st-p" id="st-p1"><span>ORDER TOTAL</span><b id="st-v1">$2,315.50</b></div>
            <div class="st-p" id="st-p2"><span>ORDER TOTAL</span><b id="st-v2">$12,400.00</b></div>
          </div>
          <div id="st-lost"><b>−$15,955.50</b>  reading as lost</div>

          <!-- 3. The restore -->
          <div class="st-hm" style="top:236px; height:120px"><div class="st-h st-m" id="st-b1">So you restore</div></div>
          <div class="st-hm" style="top:356px; height:120px"><div class="st-h st-m" id="st-b2"><i>last night's backup.</i></div></div>
          <div id="st-line"></div>
          <div class="st-tick" style="left:200px"></div><div class="st-tick" style="left:820px"></div><div class="st-tick" style="left:1240px"></div><div class="st-tick" style="left:1480px"></div><div class="st-tick" style="left:1718px"></div>
          <div class="st-mk" id="st-mk0" style="left:218px">BACKUP · 00:00</div>
          <div class="st-mk" id="st-mk1" style="left:1672px">NOW</div>
          <div id="st-play"></div>
          <div id="st-clock">14:03</div>
          <div id="st-ok">✓ the totals are back</div>

          <!-- 4. Everything else came back too -->
          <div class="st-hm" style="top:216px; height:120px"><div class="st-h st-m" id="st-c1">The totals came back.</div></div>
          <div class="st-hm" style="top:336px; height:120px"><div class="st-h st-m" id="st-c2"><i>So did everything else.</i></div></div>
          <div id="st-cards">
            <div class="st-c" id="st-k0"><div class="k">CUSTOMER<b>RESURRECTED</b></div><div class="t">The customer who asked to be deleted <i>is back.</i></div>
              <svg class="ico" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="15" r="8" fill="none" stroke="#ffa185" stroke-width="3"/><path d="M7 40c2-9 8-13 15-13s13 4 15 13" fill="none" stroke="#ffa185" stroke-width="3"/></svg></div>
            <div class="st-c" id="st-k1"><div class="k">ACCESS<b>RE-ENABLED</b></div><div class="t">The account you revoked after a leak <i>is live again.</i></div>
              <svg class="ico" viewBox="0 0 44 44" aria-hidden="true"><circle cx="14" cy="22" r="8" fill="none" stroke="#ffa185" stroke-width="3"/><path d="M22 22h18M33 22v8M39 22v6" fill="none" stroke="#ffa185" stroke-width="3"/></svg></div>
            <div class="st-c" id="st-k2"><div class="k">ORDER<b>UN-SHIPPED</b></div><div class="t">The order you already shipped <i>says ‘processing’.</i></div>
              <svg class="ico" viewBox="0 0 44 44" aria-hidden="true"><path d="M6 14l16-8 16 8v18l-16 8-16-8z M6 14l16 8 16-8 M22 22v18" fill="none" stroke="#ffa185" stroke-width="3" stroke-linejoin="round"/></svg></div>
          </div>

          <!-- 5. The insight -->
          <div class="st-hm" style="top:330px; height:164px"><div class="st-h st-q" id="st-d1">A backup can't tell</div></div>
          <div class="st-hm" style="top:494px; height:164px"><div class="st-h st-q" id="st-d2"><i>damage from a decision.</i></div></div>
        </div>
        <div id="st-flash" data-layout-ignore></div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
          var GLYPHS = "ABCDEFGHJKLMNPRSTUVWXYZ0123456789$#%&*";
          function scramble(target, k, p) {
            var out = "";
            for (var i = 0; i < target.length; i++) out += (i < Math.floor(p * target.length) || target[i] === "," || target[i] === ".") ? target[i] : GLYPHS[Math.floor(hash(k * 31 + i * 7) * GLYPHS.length)];
            return out;
          }
          // Everything that is not in beat 1 starts hidden; each beat reveals its own layer.
          gsap.set("#st-a1, #st-a2, #st-b1, #st-b2, #st-c1, #st-c2, #st-d1, #st-d2", { yPercent: 102 });
          gsap.set("#st-prices, #st-lost, #st-ok, .st-mk, .st-tick, #st-play, #st-clock, #st-cards, .st-c", { opacity: 0 });
          // Each beat's headline shares screen space with the next; outside its window it is not just masked but hidden.
          var BEATS = [["#st-q1, #st-q2", 0, 3.96], ["#st-a1, #st-a2", 3.99, 7.96], ["#st-b1, #st-b2", 7.99, 10.14], ["#st-c1, #st-c2", 10.09, 14.01], ["#st-d1, #st-d2", 13.99, 15.98]];
          BEATS.forEach(function (b) {
            gsap.set(b[0], { visibility: b[1] === 0 ? "visible" : "hidden" });
            if (b[1] > 0) tl.set(b[0], { visibility: "visible" }, b[1]);
            if (b[2] < 99) tl.set(b[0], { visibility: "hidden" }, b[2]);
          });

          // ── 1 (0–4): the question. The line draws under it.
          tl.fromTo("#st-q1", { yPercent: 102 }, { yPercent: 0, duration: 0.7, ease: "power4.out" }, 0.3);
          tl.fromTo("#st-q2", { yPercent: 102 }, { yPercent: 0, duration: 0.8, ease: "expo.out" }, 0.55);
          tl.fromTo("#st-line", { scaleX: 0 }, { scaleX: 1, duration: 1.1, ease: "expo.inOut" }, 0.2);
          tl.fromTo("#st-world", { scale: 1.03 }, { scale: 1, duration: 3.8, ease: "sine.out" }, 0);
          tl.to("#st-q1, #st-q2", { yPercent: -104, duration: 0.3, ease: "power3.in", stagger: 0.05 }, 3.65);

          // ── 2 (4–8): it's 2:14 AM; the totals go to zero.
          var STAMP = "02:14 AM  ·  migration fx_rounding  ·  orders table", stamp = document.getElementById("st-stamp"), sv = { v: 0 };
          tl.to(sv, { v: STAMP.length, duration: 0.7, ease: "none", onUpdate: function () { stamp.textContent = STAMP.substring(0, Math.floor(sv.v)); } }, 4.05);
          tl.to("#st-a1", { yPercent: 0, duration: 0.6, ease: "power4.out" }, 4.0);
          tl.to("#st-a2", { yPercent: 0, duration: 0.7, ease: "expo.out" }, 4.18);
          tl.fromTo("#st-prices", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 4.45);
          var V = ["$1,240.00", "$2,315.50", "$12,400.00"];
          V.forEach(function (v, i) {
            var el = document.getElementById("st-v" + i), z = { p: 0 }, t = 5.0 + i * 0.2;
            tl.to(z, { p: 1, duration: 0.18, ease: "none", onUpdate: function () { el.textContent = z.p < 1 ? scramble("$0.00", i * 13 + Math.floor(z.p * 6), z.p) : "$0.00"; } }, t);
            tl.to(el, { color: "#ffa185", duration: 0.05, ease: "none" }, t);
            tl.to("#st-p" + i, { borderColor: "rgba(255,161,133,0.6)", duration: 0.05, ease: "none" }, t);
            tl.fromTo("#st-p" + i, { x: 0 }, { x: 8, duration: 0.04, ease: "none", yoyo: true, repeat: 3, immediateRender: false }, t);
          });
          tl.fromTo("#st-lost", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, 5.9);
          tl.to("#st-red", { opacity: 0.8, duration: 0.6, ease: "power2.out" }, 5.0);
          tl.to("#st-red", { opacity: 0.25, duration: 2.0, ease: "sine.inOut" }, 5.6);
          tl.to("#st-a1, #st-a2", { yPercent: -104, duration: 0.3, ease: "power3.in", stagger: 0.05 }, 7.65);
          tl.to("#st-lost", { opacity: 0, duration: 0.25, ease: "power2.in" }, 7.7);
          tl.to(stamp, { opacity: 0, duration: 0.25, ease: "power2.in" }, 7.7);

          // ── 3 (8–10): restore last night's backup. The line is now a timeline; the playhead rewinds.
          tl.to("#st-b1", { yPercent: 0, duration: 0.55, ease: "power4.out" }, 8.0);
          tl.to("#st-b2", { yPercent: 0, duration: 0.65, ease: "expo.out" }, 8.12);
          tl.fromTo(".st-tick, .st-mk", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.04, immediateRender: false }, 8.1);
          var play = { x: 1718 }, clockEl = document.getElementById("st-clock");
          function drawPlay() {
            document.getElementById("st-play").style.transform = "translateX(" + play.x.toFixed(1) + "px)";
            clockEl.style.left = play.x.toFixed(1) + "px";
            var mins = Math.round((play.x - 200) / (1718 - 200) * (14 * 60 + 3));
            clockEl.textContent = (mins < 600 ? "0" : "") + Math.floor(mins / 60) + ":" + (mins % 60 < 10 ? "0" : "") + (mins % 60);
          }
          gsap.set("#st-clock", { xPercent: -50 });
          drawPlay();
          tl.fromTo("#st-play, #st-clock", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none", immediateRender: false }, 8.25);
          tl.to(play, { x: 200, duration: 1.2, ease: "power3.inOut", onUpdate: drawPlay }, 8.35);
          tl.to("#st-red", { opacity: 0, duration: 0.8, ease: "power2.out" }, 8.4);
          V.forEach(function (v, i) {
            var el = document.getElementById("st-v" + i), z = { p: 0 }, t = 9.45 + i * 0.08;
            tl.to(z, { p: 1, duration: 0.2, ease: "none", onUpdate: function () { el.textContent = z.p < 1 ? scramble(v, i * 17 + Math.floor(z.p * 6), z.p) : v; } }, t);
            tl.to(el, { color: "#a3ccb3", duration: 0.05, ease: "none" }, t);
            tl.to("#st-p" + i, { borderColor: "rgba(163,204,179,0.6)", duration: 0.05, ease: "none" }, t);
          });
          tl.fromTo("#st-ok", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", immediateRender: false }, 9.6);

          // ── 4 (10–14): the totals came back. So did everything decided since.
          tl.to("#st-b1, #st-b2", { yPercent: -104, duration: 0.28, ease: "power3.in", stagger: 0.04 }, 9.85);
          tl.to("#st-prices, #st-ok, .st-mk, .st-tick", { opacity: 0, y: 20, filter: "blur(8px)", duration: 0.3, ease: "power3.in" }, 9.9);
          tl.to("#st-play, #st-clock", { opacity: 0, duration: 0.25, ease: "power3.in" }, 9.9);
          tl.to("#st-line", { opacity: 0.35, duration: 0.3, ease: "none" }, 9.9);
          tl.to("#st-c1", { yPercent: 0, duration: 0.55, ease: "power4.out" }, 10.1);
          tl.to("#st-c2", { yPercent: 0, duration: 0.65, ease: "expo.out" }, 10.3);
          tl.set("#st-cards", { opacity: 1 }, 10.85);
          [10.9, 11.5, 12.1].forEach(function (t, i) {
            var id = "#st-k" + i;
            tl.fromTo(id, { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "expo.out", immediateRender: false }, t);
            tl.fromTo(id, { boxShadow: "0 0 0px 0px rgba(255,161,133,0)" }, { boxShadow: "0 0 40px 8px rgba(255,161,133,0.45)", duration: 0.06, ease: "none", immediateRender: false }, t + 0.05);
            tl.to(id, { boxShadow: "0 0 0px 0px rgba(255,161,133,0)", duration: 0.6, ease: "power2.out" }, t + 0.11);
            var g = { a: 0 };
            tl.fromTo(g, { a: 1 }, { a: 0, duration: 0.3, ease: "power2.out", immediateRender: false, onUpdate: function () {
              var k = Math.floor(tl.time() * 30), el = document.querySelector(id + " .k b");
              el.style.transform = "translate(" + ((hash(k * 5 + i) * 2 - 1) * 10 * g.a).toFixed(1) + "px," + ((hash(k * 9 + i) * 2 - 1) * 4 * g.a).toFixed(1) + "px)";
            } }, t + 0.05);
          });
          tl.to("#st-red", { opacity: 0.55, duration: 1.4, ease: "power2.in" }, 11.0);

          // ── 5 (14–16): the insight; then the frame collapses into one hot line for the brand.
          tl.to("#st-c1, #st-c2", { yPercent: -104, duration: 0.3, ease: "power3.in", stagger: 0.05 }, 13.7);
          tl.to("#st-cards", { opacity: 0.18, scale: 0.96, filter: "blur(10px)", y: 60, duration: 0.5, ease: "power2.inOut" }, 13.7);
          tl.to("#st-red", { opacity: 0.2, duration: 0.6, ease: "power2.out" }, 13.8);
          tl.to("#st-d1", { yPercent: 0, duration: 0.6, ease: "power4.out" }, 14.0);
          tl.to("#st-d2", { yPercent: 0, duration: 0.7, ease: "expo.out" }, 14.2);
          tl.fromTo("#st-world", { scaleY: 1, scaleX: 1, filter: "brightness(1)" }, { scaleY: 0.004, scaleX: 1.04, filter: "brightness(2.2)", duration: 0.32, ease: "power3.in", immediateRender: false }, 15.62);
          tl.fromTo("#st-flash", { opacity: 0, scaleX: 0.3 }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power3.in", immediateRender: false }, 15.66);

          window.__timelines["story"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
