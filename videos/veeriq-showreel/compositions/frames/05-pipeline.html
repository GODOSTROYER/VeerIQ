      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var world = document.getElementById("pp-world"), ghosts = document.getElementById("pp-ghosts");
          var cam = { x: 0, s: 1 };
          function applyCamera() {
            world.style.transform = "translate(" + cam.x.toFixed(2) + "px,0px) scale(" + cam.s.toFixed(4) + ")";
            ghosts.style.transform = "translate(" + (cam.x * 0.85).toFixed(2) + "px,0px)";
          }
          world.style.transformOrigin = "0px 540px";
          applyCamera();

          // Enter: whip in from the right, velocity-matched to the previous frame's exit.
          tl.fromTo("#pp-cam", { x: 420, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, 0);
          tl.fromTo("#pp-wire", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "expo.inOut" }, 0.0);

          // Camera stops: station k sits centred at cam.x = -1500k. Each pan dips scale a touch for depth.
          var PANS = [1.6, 3.6, 5.6, 9.0, 11.0];
          PANS.forEach(function (t, i) {
            tl.to(cam, { x: -1500 * (i + 1), duration: 0.62, ease: "power3.inOut", onUpdate: applyCamera }, t);
            var dip = { v: 0 };
            tl.to(dip, { v: 1, duration: 0.62, ease: "none", onUpdate: function () { cam.s = 1 - Math.sin(dip.v * Math.PI) * 0.035; applyCamera(); } }, t);
            tl.fromTo("#pp-cam", { filter: "blur(0px)" }, { filter: "blur(4px)", duration: 0.31, ease: "power2.in", immediateRender: false }, t);
            tl.to("#pp-cam", { filter: "blur(0px)", duration: 0.31, ease: "power2.out" }, t + 0.31);
          });

          // Station reveals: kicker clips in, headline rises from its mask, details stagger.
          var REVEAL = [0.2, 1.95, 3.95, 5.95, 9.35, 11.35];
          for (var k = 0; k < 6; k++) {
            var st = "#pp-s" + k, r = REVEAL[k];
            tl.fromTo(st + " .pp-kick", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, r);
            tl.fromTo(st + " .pp-h", { yPercent: 100 }, { yPercent: 0, duration: 0.62, ease: "expo.out" }, r + 0.06);
          }
          tl.fromTo("#pp-s0 .pp-chip", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 0.55);
          var exp = document.getElementById("pp-exp"), ex = { s: 0 };
          tl.to(ex, { s: 2, duration: 2, ease: "steps(2)", onUpdate: function () { exp.textContent = "29:5" + (10 - Math.round(ex.s)) % 10; if (ex.s < 0.5) exp.textContent = "30:00"; } }, 0.6);
          tl.fromTo("#pp-s1 .pp-chip.aq", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", stagger: 0.06 }, 2.3);
          tl.fromTo("#pp-s1 .pp-chip.no", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 2.75);
          tl.fromTo("#pp-s2 .pp-flow", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.25);
          ["#pp-t0", "#pp-t1", "#pp-t2", "#pp-t3"].forEach(function (id, i) {
            tl.to(id, { color: "#f2f1ed", borderColor: "rgba(242,241,237,0.85)", duration: 0.15, ease: "none" }, 4.45 + i * 0.2);
          });
          tl.to("#pp-t3", { borderColor: "#e8602c", color: "#e8602c", duration: 0.15, ease: "none" }, 5.15);

          // MCP: the server node drops onto the wire; the label types; the packet flashes it on the way through.
          tl.fromTo("#pp-mcp", { opacity: 0, scaleY: 0.3 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: "expo.out" }, 4.05);
          tl.fromTo("#pp-mcpl", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.4, ease: "power3.out" }, 4.2);
          tl.fromTo("#pp-mnote", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.6);
          tl.fromTo("#pp-mcp", { boxShadow: "0 0 0px 0px rgba(255,128,80,0)" }, { boxShadow: "0 0 34px 8px rgba(255,128,80,0.65)", duration: 0.08, ease: "none", immediateRender: false }, 5.82);
          tl.to("#pp-mcp", { boxShadow: "0 0 0px 0px rgba(255,128,80,0)", duration: 0.5, ease: "power2.out" }, 5.9);

          // The proposed call becomes a packet and rides the wire.
          var PK = { x: 3300 + 1003, y: 708 };
          gsap.set("#pp-packet", { opacity: 0 });
          tl.fromTo("#pp-packet", { opacity: 0, x: PK.x, y: PK.y, scale: 0.9 }, { opacity: 1, x: PK.x, y: PK.y - 18, scale: 1, duration: 0.25, ease: "power3.out", immediateRender: false }, 5.3);
          tl.to("#pp-packet", { x: 4800 + 30, y: 581, duration: 0.65, ease: "power3.inOut" }, 5.6);
          tl.fromTo("#pp-gnote", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.35);
          gsap.set(".pp-gate .pass", { opacity: 0 });
          tl.fromTo(".pp-gate", { opacity: 0, scaleY: 0.4 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: "expo.out", stagger: 0.05 }, 5.95);
          var GX = [5035, 5285, 5535, 5785, 6035, 6285];
          GX.forEach(function (gx, j) {
            var ta = 6.62 + j * 0.3;
            tl.to("#pp-packet", { x: gx - 125, duration: 0.2, ease: "power2.inOut" }, ta - 0.2);
            tl.fromTo("#pp-g" + j, { scale: 1 }, { scale: 1.1, duration: 0.06, ease: "none", immediateRender: false }, ta);
            tl.to("#pp-g" + j, { scale: 1, duration: 0.3, ease: "power3.out" }, ta + 0.06);
            tl.fromTo("#pp-g" + j + " .pass", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.25, ease: "power3.out", immediateRender: false }, ta + 0.04);
          });
          tl.to("#pp-packet", { x: 6440, duration: 0.3, ease: "power2.out" }, 8.42);
          // Into the database; absorbed on commit.
          tl.to("#pp-packet", { x: 6661, y: 743, scale: 0.6, duration: 0.6, ease: "power3.inOut" }, 9.0);
          tl.to("#pp-packet", { scale: 0, opacity: 0, duration: 0.2, ease: "power3.in" }, 9.62);
          tl.fromTo("#pp-db", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.08, duration: 0.1, ease: "none", immediateRender: false }, 9.8);
          tl.to("#pp-db", { scale: 1, duration: 0.4, ease: "power3.out" }, 9.9);
          ["#pp-k0", "#pp-k1", "#pp-k2", "#pp-k3"].forEach(function (id, i) {
            tl.fromTo(id, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 9.75 + i * 0.16);
          });
          tl.fromTo("#pp-commit", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 10.45);
          // Evidence: blocks link into a chain, then the seal.
          for (var b = 0; b < 5; b++) {
            tl.fromTo("#pp-b" + b, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 11.55 + b * 0.14);
            if (b < 4) tl.fromTo("#pp-l" + b, { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power2.out" }, 11.75 + b * 0.14);
          }
          tl.fromTo("#pp-seal", { opacity: 0, scale: 1.2 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 12.45);
          tl.fromTo("#pp-b4", { boxShadow: "0 0 0px 0px rgba(255,128,80,0)" }, { boxShadow: "0 0 30px 6px rgba(255,128,80,0.6)", duration: 0.3, ease: "power2.out" }, 12.45);
          var drift = { v: 0 };
          tl.to(drift, { v: 1, duration: 2.0, ease: "sine.inOut", onUpdate: function () { cam.x = -7500 - drift.v * 40; applyCamera(); } }, 11.75);

          // Exit: zoom through into the boundary test.
          tl.fromTo("#pp-cam", { scale: 1, filter: "blur(0px)" }, { scale: 1.22, filter: "blur(18px)", duration: 0.22, ease: "power3.in", immediateRender: false }, 13.78);

          // 90 s cut: the scene runs 12 s instead of 14 s. The motion above is authored on the
          // original 14 s clock; T() remaps it. Stations 01-03 keep their timing; the six gate
          // passes tighten from 0.3 s to 0.22 s apart; ONE TRANSACTION plays at 0.7x its length
          // and SIGNED EVIDENCE at 2/3. Every child keeps its order and its ease.
          function T(t) {
            if (t <= 6.62) return t;
            if (t <= 8.12) return 6.62 + (t - 6.62) * (0.22 / 0.3);
            if (t <= 9.0) return t - 0.4;
            if (t <= 11.0) return 8.6 + (t - 9.0) * 0.7;
            return 10.0 + (t - 11.0) * (2 / 3);
          }
          tl.getChildren(false, true, true).forEach(function (c) {
            var s0 = c.startTime(), d0 = c.duration(), s1 = T(s0);
            if (d0 > 0) c.duration(Math.max(0.001, T(s0 + d0) - s1));
            c.startTime(s1);
          });

          window.__timelines["pipeline"] = tl;
        })();
      </script>
    </template>
