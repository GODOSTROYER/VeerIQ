    <template id="captions-template">
      <style>
        @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("../assets/fonts/InstrumentSerif-normal-400.woff2") format("woff2"); }

        .cap { position: absolute; left: 0; right: 0; top: 954px; display: flex; justify-content: center; visibility: hidden; }
        .cap span { padding: 4px 22px 7px; background: rgba(14,14,16,0.86); border-radius: 6px; font-family: "Instrument Serif", serif; font-size: 40px; line-height: 46px; letter-spacing: -0.005em; color: #f2f1ed; white-space: nowrap; }
      </style>
      <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
          <div class="cap" id="cap-0"><span>July, twenty twenty-five.</span></div>
          <div class="cap" id="cap-1"><span>An AI coding agent wiped a company&#x27;s</span></div>
          <div class="cap" id="cap-2"><span>production database, in the middle of a</span></div>
          <div class="cap" id="cap-3"><span>code freeze.</span></div>
          <div class="cap" id="cap-4"><span>Then it said the damage couldn&#x27;t be</span></div>
          <div class="cap" id="cap-5"><span>undone. It could.</span></div>
          <div class="cap" id="cap-6"><span>There was a backup.</span></div>
          <div class="cap" id="cap-7"><span>But a backup has a catch.</span></div>
          <div class="cap" id="cap-8"><span>Ever had to restore a backup?</span></div>
          <div class="cap" id="cap-9"><span>At two in the morning,</span></div>
          <div class="cap" id="cap-10"><span>a bad migration wipes your order totals.</span></div>
          <div class="cap" id="cap-11"><span>So you roll back to last night.</span></div>
          <div class="cap" id="cap-12"><span>The totals come back.</span></div>
          <div class="cap" id="cap-13"><span>But so does everything else:</span></div>
          <div class="cap" id="cap-14"><span>the customer who asked to be deleted,</span></div>
          <div class="cap" id="cap-15"><span>the account you revoked after a leak,</span></div>
          <div class="cap" id="cap-16"><span>the order you already shipped.</span></div>
          <div class="cap" id="cap-17"><span>Meet VeerIQ.</span></div>
          <div class="cap" id="cap-18"><span>It repairs only the damage,</span></div>
          <div class="cap" id="cap-19"><span>and keeps every decision you made since.</span></div>
          <div class="cap" id="cap-20"><span>Here&#x27;s what you get.</span></div>
          <div class="cap" id="cap-21"><span>Damaged values, restored from an approved snapshot.</span></div>
          <div class="cap" id="cap-22"><span>Deletions, revoked access and later edits,</span></div>
          <div class="cap" id="cap-23"><span>left exactly as they are.</span></div>
          <div class="cap" id="cap-24"><span>And a signed record of every step.</span></div>
          <div class="cap" id="cap-25"><span>An AI agent does the repair,</span></div>
          <div class="cap" id="cap-26"><span>but it never holds the keys.</span></div>
          <div class="cap" id="cap-27"><span>It can only propose.</span></div>
          <div class="cap" id="cap-28"><span>Every action goes through VeerIQ&#x27;s MCP server</span></div>
          <div class="cap" id="cap-29"><span>and six gates, including ArmorIQ,</span></div>
          <div class="cap" id="cap-30"><span>which signs the plan before the model</span></div>
          <div class="cap" id="cap-31"><span>runs. And every change lands in one</span></div>
          <div class="cap" id="cap-32"><span>locked database transaction.</span></div>
          <div class="cap" id="cap-33"><span>Here it is, live:</span></div>
          <div class="cap" id="cap-34"><span>control-Z for AI agents.</span></div>
          <div class="cap" id="cap-35"><span>Anyone can run this demo in about</span></div>
          <div class="cap" id="cap-36"><span>three minutes.</span></div>
          <div class="cap" id="cap-37"><span>Step one:</span></div>
          <div class="cap" id="cap-38"><span>three orders were damaged, and three decisions</span></div>
          <div class="cap" id="cap-39"><span>were made after the backup.</span></div>
          <div class="cap" id="cap-40"><span>Those must stay.</span></div>
          <div class="cap" id="cap-41"><span>Step two:</span></div>
          <div class="cap" id="cap-42"><span>two ways to undo it.</span></div>
          <div class="cap" id="cap-43"><span>Restoring the backup fixes three orders,</span></div>
          <div class="cap" id="cap-44"><span>but breaks four things that happened since.</span></div>
          <div class="cap" id="cap-45"><span>VeerIQ gives an AI agent one narrow</span></div>
          <div class="cap" id="cap-46"><span>job instead.</span></div>
          <div class="cap" id="cap-47"><span>And the backup hides a note,</span></div>
          <div class="cap" id="cap-48"><span>telling it to re-enable the revoked account.</span></div>
          <div class="cap" id="cap-49"><span>A live model takes the bait.</span></div>
          <div class="cap" id="cap-50"><span>ArmorIQ blocks the call, because it was</span></div>
          <div class="cap" id="cap-51"><span>never in the signed plan.</span></div>
          <div class="cap" id="cap-52"><span>The agent repairs only the damage,</span></div>
          <div class="cap" id="cap-53"><span>and every later decision stays.</span></div>
          <div class="cap" id="cap-54"><span>Step three:</span></div>
          <div class="cap" id="cap-55"><span>one repair is worth twelve thousand four</span></div>
          <div class="cap" id="cap-56"><span>hundred dollars.</span></div>
          <div class="cap" id="cap-57"><span>VeerIQ won&#x27;t let anyone commit that alone:</span></div>
          <div class="cap" id="cap-58"><span>not the agent, and not the person</span></div>
          <div class="cap" id="cap-59"><span>who asked.</span></div>
          <div class="cap" id="cap-60"><span>So the judge becomes the second key,</span></div>
          <div class="cap" id="cap-61"><span>and approves the exact change.</span></div>
          <div class="cap" id="cap-62"><span>Step four:</span></div>
          <div class="cap" id="cap-63"><span>don&#x27;t trust our screen.</span></div>
          <div class="cap" id="cap-64"><span>Your own browser checks the signed receipt.</span></div>
          <div class="cap" id="cap-65"><span>Change a single cent, and it fails.</span></div>
          <div class="cap" id="cap-66"><span>In the ArmorIQ console, our live runs</span></div>
          <div class="cap" id="cap-67"><span>show up:</span></div>
          <div class="cap" id="cap-68"><span>the agent and its MCP server,</span></div>
          <div class="cap" id="cap-69"><span>every allowed call, and the one that</span></div>
          <div class="cap" id="cap-70"><span>was blocked.</span></div>
          <div class="cap" id="cap-71"><span>And these are our rules in Policy</span></div>
          <div class="cap" id="cap-72"><span>Studio: the five recovery tools are allowed,</span></div>
          <div class="cap" id="cap-73"><span>and restoring access is denied.</span></div>
          <div class="cap" id="cap-74"><span>Bring your own agent.</span></div>
          <div class="cap" id="cap-75"><span>Any MCP client can drive VeerIQ&#x27;s recovery</span></div>
          <div class="cap" id="cap-76"><span>server. Six tools are exposed,</span></div>
          <div class="cap" id="cap-77"><span>five are signed, and one is refused,</span></div>
          <div class="cap" id="cap-78"><span>all checked inside the server.</span></div>
          <div class="cap" id="cap-79"><span>So how do you plug VeerIQ into</span></div>
          <div class="cap" id="cap-80"><span>your system?</span></div>
          <div class="cap" id="cap-81"><span>Four steps.</span></div>
          <div class="cap" id="cap-82"><span>First, deploy it with Docker.</span></div>
          <div class="cap" id="cap-83"><span>Second, connect ArmorIQ with one command.</span></div>
          <div class="cap" id="cap-84"><span>It registers the agent, the MCP server,</span></div>
          <div class="cap" id="cap-85"><span>and the policy.</span></div>
          <div class="cap" id="cap-86"><span>Third, bring your data:</span></div>
          <div class="cap" id="cap-87"><span>CSV, JSON, or a read-only Postgres,</span></div>
          <div class="cap" id="cap-88"><span>plus an approved snapshot.</span></div>
          <div class="cap" id="cap-89"><span>Then map your columns:</span></div>
          <div class="cap" id="cap-90"><span>what may be repaired, and what must</span></div>
          <div class="cap" id="cap-91"><span>never change.</span></div>
          <div class="cap" id="cap-92"><span>Finally, authorize one narrow repair and run</span></div>
          <div class="cap" id="cap-93"><span>it. You get a receipt and a</span></div>
          <div class="cap" id="cap-94"><span>signed evidence file.</span></div>
          <div class="cap" id="cap-95"><span>Today, repairs land in VeerIQ&#x27;s recovery workspace.</span></div>
          <div class="cap" id="cap-96"><span>Writing back to your own systems is</span></div>
          <div class="cap" id="cap-97"><span>next.</span></div>
          <div class="cap" id="cap-98"><span>So what can you expect?</span></div>
          <div class="cap" id="cap-99"><span>Only damaged values restored.</span></div>
          <div class="cap" id="cap-100"><span>Every later decision kept.</span></div>
          <div class="cap" id="cap-101"><span>Forbidden actions stopped before they run,</span></div>
          <div class="cap" id="cap-102"><span>with the layer that stopped them named.</span></div>
          <div class="cap" id="cap-103"><span>In eighty-four live trials, the model tried</span></div>
          <div class="cap" id="cap-104"><span>to re-enable the revoked account twenty-three</span></div>
          <div class="cap" id="cap-105"><span>times. ArmorIQ blocked all twenty-three.</span></div>
          <div class="cap" id="cap-106"><span>Zero forbidden effects.</span></div>
          <div class="cap" id="cap-107"><span>What we learned:</span></div>
          <div class="cap" id="cap-108"><span>plan binding stops a hijacked agent cold.</span></div>
          <div class="cap" id="cap-109"><span>But tools aren&#x27;t arguments, so data rules</span></div>
          <div class="cap" id="cap-110"><span>have to live next to the data.</span></div>
          <div class="cap" id="cap-111"><span>Next, we want ArmorIQ holds for high-value</span></div>
          <div class="cap" id="cap-112"><span>repairs, argument-level policy, and connectors</span></div>
          <div class="cap" id="cap-113"><span>that write back through the same gates.</span></div>
          <div class="cap" id="cap-114"><span>VeerIQ. Restore yesterday&#x27;s data.</span></div>
          <div class="cap" id="cap-115"><span>Keep today&#x27;s decisions.</span></div>
      </div>
