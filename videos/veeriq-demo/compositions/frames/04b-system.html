      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });

          // Enter: whip in from the right, velocity-matched to the previous frame's exit.
          tl.fromTo("#ar-cam", { x: 420, filter: "blur(18px)" }, { x: 0, filter: "blur(0px)", duration: 0.32, ease: "power3.out" }, 0);
          tl.fromTo("#ar-kick", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, 0.15);
          tl.fromTo("#ar-h", { yPercent: 102 }, { yPercent: 0, duration: 0.65, ease: "expo.out" }, 0.25);

          // The boundary draws from its anchor; it never fades in.
          tl.fromTo("#ar-line", { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "expo.inOut" }, 0.55);
          tl.fromTo("#ar-line-l", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, 0.95);
          tl.fromTo(".ar-zone", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.1 }, 0.9);

          // Components assemble: the untrusted side first, then VeerIQ's side in reading order.
          var BOXES = [["#ar-agent", 1.0], ["#ar-note", 1.12], ["#ar-mcp", 1.3], ["#ar-op", 1.4], ["#ar-disp", 1.5], ["#ar-adp", 1.62], ["#ar-aq", 1.7], ["#ar-pg", 1.8], ["#ar-ev", 1.9]];
          BOXES.forEach(function (b) {
            tl.fromTo(b[0], { opacity: 0, y: 24, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "power3.out" }, b[1]);
          });
          tl.fromTo(".ar-g", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out", stagger: 0.06 }, 1.75);
          gsap.set(".ar-tag", { opacity: 0 });

          // Wires draw from source to target.
          for (var p = 0; p < 8; p++) {
            var path = document.getElementById("ar-p" + p), len = path.getTotalLength();
            path.style.strokeDasharray = p === 0 ? "6 6" : len + " " + len;
            if (p === 0) tl.fromTo(path, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 2.1);
            else tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 2.15 + p * 0.07);
          }
          tl.fromTo("#ar-reads", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 2.2);
          tl.fromTo("#ar-chip", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.25, ease: "expo.out" }, 2.5);
          tl.fromTo("#ar-sub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.6);

          // One call walks the whole path: agent → boundary → MCP → six gates (ArmorIQ consulted) → commit → sealed.
          gsap.set("#ar-pk", { opacity: 0 });
          tl.set("#ar-pk", { x: 300, y: 470 }, 3.0);
          tl.fromTo("#ar-pk", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.22, ease: "expo.out", immediateRender: false }, 3.0);
          tl.to("#ar-pk", { x: 520, duration: 0.45, ease: "power3.in" }, 3.15);
          tl.fromTo("#ar-line", { scaleX: 1 }, { scaleX: 4, duration: 0.05, ease: "none", immediateRender: false }, 3.55);
          tl.to("#ar-line", { scaleX: 1, duration: 0.5, ease: "expo.out" }, 3.6);
          tl.fromTo("#ar-chip", { boxShadow: "0 0 0px 0px rgba(255,128,80,0)" }, { boxShadow: "0 0 28px 8px rgba(255,128,80,0.65)", duration: 0.06, ease: "none", immediateRender: false }, 3.55);
          tl.to("#ar-chip", { boxShadow: "0 0 0px 0px rgba(255,128,80,0)", duration: 0.5, ease: "power2.out" }, 3.61);
          tl.to("#ar-pk", { x: 740, duration: 0.3, ease: "power2.out" }, 3.6);
          tl.fromTo("#ar-mcp", { boxShadow: "0 0 0px 0px rgba(255,128,80,0)" }, { boxShadow: "0 0 30px 8px rgba(255,128,80,0.6)", duration: 0.08, ease: "none", immediateRender: false }, 3.8);
          tl.to("#ar-mcp", { boxShadow: "0 0 0px 0px rgba(255,128,80,0)", duration: 0.5, ease: "power2.out" }, 3.88);
          tl.to("#ar-pk", { x: 1010, duration: 0.3, ease: "power3.inOut" }, 3.95);
          tl.to("#ar-pk", { scale: 0.4, opacity: 0, duration: 0.18, ease: "power3.in" }, 4.2);

          // Gates tick one by one; at gate 03 the dispatcher asks ArmorIQ and the answer comes back.
          for (var g = 0; g < 6; g++) {
            var tg = 4.3 + g * 0.2 + (g >= 3 ? 0.35 : 0);
            tl.to("#ar-g" + g, { color: "#f2f1ed", duration: 0.12, ease: "none" }, tg);
            tl.to("#ar-g" + g + " .dot", { backgroundColor: "#a3ccb3", borderColor: "#a3ccb3", duration: 0.12, ease: "none" }, tg);
            tl.fromTo("#ar-g" + g + " .dot", { scale: 1 }, { scale: 1.6, duration: 0.06, ease: "none", immediateRender: false }, tg);
            tl.to("#ar-g" + g + " .dot", { scale: 1, duration: 0.3, ease: "power3.out" }, tg + 0.06);
          }
          gsap.set(".ar-spark", { opacity: 0 });
          tl.fromTo("#ar-sp0", { opacity: 1, x: 1420, y: 470 }, { opacity: 1, x: 1490, y: 470, duration: 0.16, ease: "power2.in", immediateRender: false }, 4.72);
          tl.set("#ar-sp0", { opacity: 0 }, 4.88);
          tl.fromTo("#ar-aq", { boxShadow: "0 0 0px 0px rgba(255,148,103,0)" }, { boxShadow: "0 0 30px 8px rgba(255,148,103,0.55)", duration: 0.08, ease: "none", immediateRender: false }, 4.88);
          tl.to("#ar-aq", { boxShadow: "0 0 0px 0px rgba(255,148,103,0)", duration: 0.6, ease: "power2.out" }, 4.96);
          tl.fromTo("#ar-aq-t", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, 4.9);
          tl.fromTo("#ar-sp1", { opacity: 1, x: 1490, y: 470 }, { opacity: 1, x: 1420, y: 470, duration: 0.16, ease: "power2.out", immediateRender: false }, 5.0);
          tl.set("#ar-sp1", { opacity: 0 }, 5.16);

          // Into the database in one transaction; the event is sealed.
          tl.fromTo("#ar-pk", { opacity: 0, x: 1330, y: 620, scale: 0.6 }, { opacity: 1, x: 1330, y: 620, scale: 0.75, duration: 0.15, ease: "power2.out", immediateRender: false }, 5.9);
          tl.to("#ar-pk", { x: 1520, scale: 0.4, opacity: 0, duration: 0.35, ease: "power3.in" }, 6.05);
          tl.fromTo("#ar-pg", { boxShadow: "0 0 0px 0px rgba(163,204,179,0)" }, { boxShadow: "0 0 30px 8px rgba(163,204,179,0.5)", duration: 0.08, ease: "none", immediateRender: false }, 6.38);
          tl.to("#ar-pg", { boxShadow: "0 0 0px 0px rgba(163,204,179,0)", duration: 0.6, ease: "power2.out" }, 6.46);
          tl.fromTo("#ar-pg-t", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, 6.4);
          tl.fromTo("#ar-sp0", { opacity: 1, x: 1420, y: 800 }, { opacity: 1, x: 1490, y: 800, duration: 0.18, ease: "power2.in", immediateRender: false }, 6.6);
          tl.set("#ar-sp0", { opacity: 0 }, 6.78);
          tl.fromTo("#ar-ev", { boxShadow: "0 0 0px 0px rgba(255,128,80,0)" }, { boxShadow: "0 0 30px 8px rgba(255,128,80,0.55)", duration: 0.08, ease: "none", immediateRender: false }, 6.78);
          tl.to("#ar-ev", { boxShadow: "0 0 0px 0px rgba(255,128,80,0)", duration: 0.6, ease: "power2.out" }, 6.86);
          tl.fromTo("#ar-ev-t", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out", immediateRender: false }, 6.8);

          // One slow push across the whole system; then whip out left into the gate fly-through.
          tl.fromTo("#ar-world", { scale: 1 }, { scale: 1.02, duration: 7.2, ease: "sine.inOut", immediateRender: false }, 0.5);
          tl.to("#ar-cam", { x: -420, filter: "blur(18px)", duration: 0.28, ease: "power3.in" }, 7.72);


          // Demo cut: retimed to the narration. ANCHORS map this scene's authored clock (left) to the
          // narration clock (right). Starts follow the map; durations follow the local slope, clamped so
          // pops stay snappy and holds do not crawl.
          var ANCHORS = [[0, 0], [2.9, 5.5], [3.0, 6.1], [3.55, 7.3], [3.8, 8.1], [4.2, 8.8], [4.3, 9.0], [4.72, 10.3], [5.16, 11.1], [5.65, 12.6], [5.9, 13.5], [6.38, 15.0], [6.8, 15.9], [7.72, 18.3], [8.0, 18.6]];
          function T(t) {
            for (var i = 1; i < ANCHORS.length; i++) {
              if (t <= ANCHORS[i][0]) { var a = ANCHORS[i - 1], b = ANCHORS[i]; return a[1] + (t - a[0]) * (b[1] - a[1]) / (b[0] - a[0]); }
            }
            var l = ANCHORS[ANCHORS.length - 1]; return l[1] + (t - l[0]);
          }
          tl.getChildren(false, true, true).forEach(function (c) {
            var s0 = c.startTime(), d0 = c.duration(), s1 = T(s0);
            if (d0 > 0) { var k = (T(s0 + d0) - s1) / d0; c.duration(d0 * Math.max(0.7, Math.min(k, 1.6))); }
            c.startTime(s1);
          });

          window.__timelines["system"] = tl;
        })();
      </script>
