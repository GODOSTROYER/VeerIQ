        (function () {
          var tl = gsap.timeline({ paused: true });
          // Arrive from below, velocity-matched to the brand frame's push up.

          gsap.set(".pm-c", { opacity: 0 });

            var c = "#pm-c" + i;
            tl.fromTo(c, { opacity: 0, y: 46, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out", immediateRender: false }, t);

          ["#pm-b0", "#pm-b1", "#pm-s"].forEach(function (id, i) {
