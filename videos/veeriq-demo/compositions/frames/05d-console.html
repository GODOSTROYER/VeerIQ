<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="console-template">
      <style>
        @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("../../assets/fonts/InstrumentSerif-normal-400.woff2") format("woff2"); }
        @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("../../assets/fonts/InstrumentSerif-italic-400.woff2") format("woff2"); }
        @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("../../assets/fonts/GeistMono-normal-100-900.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; background: #0e0e10; color: #f2f1ed; }
        /* Real screenshots of the ArmorIQ console (platform.armoriq.ai, the team's own workspace), captured read-only.
           Screenshots are 1600 px wide; shown at 1380 x 830 (scale 0.8625) from (340, 104). */
        .cn-win { position: absolute; left: 340px; top: 104px; width: 1380px; height: 830px; background: #fff; border: 2px solid rgba(242,241,237,0.28); box-shadow: 0 40px 120px rgba(0,0,0,0.6); overflow: hidden; opacity: 0; }
        .cn-win img { position: absolute; left: 0; top: 0; width: 1380px; height: 830px; transform-origin: 62% 40%; }
        #cn-left { position: absolute; left: 92px; top: 150px; width: 220px; font-family: "Geist Mono", monospace; }
        .cn-tag { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #ff9467; white-space: nowrap; }
        .cn-tag i { width: 10px; height: 10px; border-radius: 50%; background: #ff9467; }
        .cn-k { font-size: 13px; letter-spacing: 0.16em; color: #aaa9a7; margin-top: 28px; white-space: nowrap; }
        .cn-v { margin-top: 6px; font-size: 17px; color: #f2f1ed; line-height: 24px; width: 220px; }
        .cn-hl { position: absolute; border: 3px solid #FBBF24; border-radius: 10px; box-shadow: 0 0 0 6px rgba(251,191,36,0.22), 0 0 30px rgba(251,191,36,0.5); opacity: 0; }
        .cn-hl b { position: absolute; left: 50%; top: -48px; transform: translateX(-50%); padding: 7px 12px; background: #FBBF24; color: #111; border-radius: 999px; font-family: "Geist Mono", monospace; font-size: 15px; font-weight: 700; white-space: nowrap; }
        .cn-hl.below b { top: auto; bottom: -48px; }
        /* Panel 2: the agent and the MCP server cards, cropped from the registry pages (x 410-1010, y 250-490). */
        #cn-cards { position: absolute; left: 370px; top: 410px; width: 1320px; display: flex; gap: 40px; opacity: 0; }
        .cn-card { width: 640px; height: 256px; overflow: hidden; border: 2px solid rgba(242,241,237,0.28); box-shadow: 0 30px 90px rgba(0,0,0,0.55); background: #fff; position: relative; }
        .cn-card img { position: absolute; left: -437px; top: -267px; width: 1707px; }
        .cn-cap { margin-top: 20px; font-family: "Geist Mono", monospace; font-size: 18px; color: #aaa9a7; text-align: center; white-space: nowrap; }
        .cn-cap b { color: #f2f1ed; font-weight: 500; }
        #cn-chead { position: absolute; left: 370px; top: 266px; font-family: "Instrument Serif", serif; font-size: 64px; line-height: 72px; letter-spacing: -0.02em; white-space: nowrap; opacity: 0; }
        #cn-chead i { color: #a3ccb3; }
        /* Panel 4: Policy Studio drawer, 686 x 962 shown at 592 x 830 (scale 0.8628). */
        #cn-pol { position: absolute; left: 1128px; top: 104px; width: 592px; height: 830px; overflow: hidden; border: 2px solid rgba(242,241,237,0.28); box-shadow: 0 40px 120px rgba(0,0,0,0.6); background: #fff; opacity: 0; }
        #cn-pol img { width: 592px; height: 830px; }
        #cn-ptext { position: absolute; left: 140px; top: 250px; width: 940px; opacity: 0; }
        #cn-ptext .k { font-family: "Geist Mono", monospace; font-size: 22px; letter-spacing: 0.16em; color: #ff9467; white-space: nowrap; }
        .cn-pm { overflow: hidden; height: 92px; margin-top: 14px; }
        .cn-ph { font-family: "Instrument Serif", serif; font-size: 80px; line-height: 92px; letter-spacing: -0.03em; white-space: nowrap; }
        .cn-ph i { color: #a3ccb3; }
        #cn-ph2 i { color: #ff9467; }
        #cn-pnote { margin-top: 34px; font-family: "Geist Mono", monospace; font-size: 20px; line-height: 32px; color: #aaa9a7; opacity: 0; }
        #cn-pnote b { color: #f2f1ed; font-weight: 500; }
      </style>
      <div data-hf-id="hf-0tl0" id="root" data-composition-id="console" data-width="1920" data-height="1080">
        <div data-hf-id="hf-i79g" id="cn-left">
          <div data-hf-id="hf-r1hs" class="cn-tag"><i data-hf-id="hf-wt6k"></i>ARMORIQ CONSOLE</div>
          <div data-hf-id="hf-c89u" class="cn-k">WHERE</div><div data-hf-id="hf-ia6u" class="cn-v">platform.armoriq.ai</div>
          <div data-hf-id="hf-c5m8" class="cn-k">PAGE</div><div data-hf-id="hf-z98l" class="cn-v" id="cn-page">Observability › Sessions</div>
          <div data-hf-id="hf-m5pe" class="cn-k">SHOWING</div><div data-hf-id="hf-bv5f" class="cn-v" id="cn-what">One of our live runs</div>
          <div data-hf-id="hf-5x6t" class="cn-k">CAPTURED</div><div data-hf-id="hf-ip2w" class="cn-v">Read-only screenshots of our workspace</div>
        </div>

        <div data-hf-id="hf-2w3g" class="cn-win" id="cn-w1"><img data-hf-id="hf-atbw" src="../../assets/ui/console-session.png" alt="ArmorIQ console: a live run's session" /></div>
        <div data-hf-id="hf-9th2" class="cn-win" id="cn-w3"><img data-hf-id="hf-sr1h" id="cn-i3" src="../../assets/ui/console-deny.png" alt="ArmorIQ console: trace with the denied call" /></div>
        <div data-hf-id="hf-1rvc" id="cn-chead">Registered with <i data-hf-id="hf-xc8h">ArmorIQ.</i></div>
        <div data-hf-id="hf-wao8" id="cn-cards">
          <div data-hf-id="hf-yeow"><div data-hf-id="hf-uzbu" class="cn-card"><img data-hf-id="hf-nhjc" src="../../assets/ui/console-agent.png" alt="ArmorIQ agent registry" /></div><div data-hf-id="hf-0k9o" class="cn-cap">agent · <b data-hf-id="hf-wur5">rewindsafe-recovery-agent</b></div></div>
          <div data-hf-id="hf-y7yw"><div data-hf-id="hf-u8ou" class="cn-card"><img data-hf-id="hf-day3" src="../../assets/ui/console-mcp.png" alt="ArmorIQ MCP servers" /></div><div data-hf-id="hf-2nu6" class="cn-cap">MCP server · <b data-hf-id="hf-lq0t">rewindsafe-recovery</b></div></div>
        </div>
        <div data-hf-id="hf-b96w" id="cn-pol"><img data-hf-id="hf-nt7b" src="../../assets/ui/console-policy.png" alt="ArmorIQ Policy Studio: the recovery policy" /></div>
        <div data-hf-id="hf-czws" id="cn-ptext">
          <div data-hf-id="hf-xqrh" class="k">POLICY STUDIO</div>
          <div data-hf-id="hf-8h45" class="cn-pm"><div data-hf-id="hf-kuxp" class="cn-ph" id="cn-ph1">Five recovery tools: <i data-hf-id="hf-nz26">allowed.</i></div></div>
          <div data-hf-id="hf-7nqx" class="cn-pm"><div data-hf-id="hf-v7a9" class="cn-ph" id="cn-ph2">Restoring access: <i data-hf-id="hf-bs6z">denied.</i></div></div>
          <div data-hf-id="hf-pfns" id="cn-pnote"><b data-hf-id="hf-ayxd">restore_access_grant</b> is not on the allowlist,<br data-hf-id="hf-x5px" />so ArmorIQ refuses it before it runs.</div>
        </div>

        <div data-hf-id="hf-onk3" class="cn-hl" id="cn-h1a" style="left:1114px; top:384px; width:180px; height:172px"><b data-hf-id="hf-dagy">every tool the run touched</b></div>
        <div data-hf-id="hf-jxd1" class="cn-hl below" id="cn-h1b" style="left:1424px; top:452px; width:156px; height:36px"><b data-hf-id="hf-wz60">6 checks · 1 blocked</b></div>
        <div data-hf-id="hf-5kyf" class="cn-hl below" id="cn-h3a" style="left:784px; top:708px; width:456px; height:96px"><b data-hf-id="hf-ekwc">prepare_repair_manifest · Allow</b></div>
        <div data-hf-id="hf-x9i9" class="cn-hl" id="cn-h3b" style="left:712px; top:364px; width:552px; height:70px"><b data-hf-id="hf-luv2">restore_access_grant · Deny</b></div>
        <div data-hf-id="hf-bioq" class="cn-hl below" id="cn-h3c" style="left:1282px; top:184px; width:412px; height:268px"><b data-hf-id="hf-0pe3">tool-not-in-plan · block</b></div>
        <div data-hf-id="hf-7326" class="cn-hl below" id="cn-h4" style="left:1146px; top:519px; width:558px; height:248px"><b data-hf-id="hf-ajh3">the five allowed tools</b></div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          var page = document.getElementById("cn-page"), what = document.getElementById("cn-what");
          function hl(id, t) { tl.fromTo(id, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, t); }
          gsap.set(".cn-hl", { opacity: 0 });
          tl.fromTo("#cn-left", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.1);
          // 1 (0-4.1) "In the ArmorIQ console, the same run shows up": this run's session.
          tl.fromTo("#cn-w1", { opacity: 0, y: 40, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 0.05);
          hl("#cn-h1a", 1.3);
          tl.to("#cn-h1a", { opacity: 0, duration: 0.25, ease: "none" }, 2.6);
          hl("#cn-h1b", 2.7);
          tl.to("#cn-h1b", { opacity: 0, duration: 0.2, ease: "none" }, 3.85);
          tl.to("#cn-w1", { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, 3.8);
          // 2 (4.1-6.1) "the agent and its MCP server"
          tl.set(page, { textContent: "Inventory › Agents, MCP Servers" }, 4.1);
          tl.set(what, { textContent: "The agent and its MCP server" }, 4.1);
          tl.fromTo("#cn-chead", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 4.1);
          tl.fromTo("#cn-cards > div", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 1.15 }, 4.15);
          tl.set("#cn-cards", { opacity: 1 }, 4.1);
          tl.to("#cn-cards, #cn-chead", { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, 6.0);
          // 3 (6.3-9.7) "every allowed call, and the one that was blocked": the trace tree and the deny detail.
          tl.set(page, { textContent: "Observability › Traces" }, 6.3);
          tl.set(what, { textContent: "Every call, and the one ArmorIQ blocked" }, 6.3);
          tl.fromTo("#cn-w3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 6.3);
          hl("#cn-h3a", 7.0);
          tl.to("#cn-h3a", { opacity: 0, duration: 0.25, ease: "none" }, 8.2);
          hl("#cn-h3b", 8.4);
          hl("#cn-h3c", 8.75);
          tl.fromTo("#cn-i3", { scale: 1 }, { scale: 1.025, duration: 3.4, ease: "sine.inOut", immediateRender: false }, 6.3);
          tl.to("#cn-h3b, #cn-h3c", { opacity: 0, duration: 0.25, ease: "none" }, 9.5);
          tl.to("#cn-w3, #cn-left", { opacity: 0, duration: 0.3, ease: "power2.in" }, 9.45);
          // 4 (9.8-18.6) "And these are our rules in Policy Studio: the five recovery tools are allowed, and restoring access is denied."
          tl.fromTo("#cn-pol", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 9.85);
          tl.set("#cn-ptext", { opacity: 1 }, 9.9);
          gsap.set("#cn-ph1, #cn-ph2", { yPercent: 102 });
          tl.fromTo("#cn-ptext .k", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 10.1);
          tl.to("#cn-ph1", { yPercent: 0, duration: 0.6, ease: "expo.out" }, 13.3);
          hl("#cn-h4", 13.5);
          tl.to("#cn-ph2", { yPercent: 0, duration: 0.6, ease: "expo.out" }, 15.5);
          tl.fromTo("#cn-pnote", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, 16.2);
          tl.to("#cn-h4", { opacity: 0, duration: 0.3, ease: "none" }, 17.9);
          tl.to("#cn-pol, #cn-ptext", { opacity: 0, filter: "blur(10px)", duration: 0.35, ease: "power2.in" }, 18.2);
          window.__timelines["console"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
