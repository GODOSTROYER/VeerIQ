<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="judgesov-template">
      <style>
        @font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; src: url("../../assets/fonts/InstrumentSerif-normal-400.woff2") format("woff2"); }
        @font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; src: url("../../assets/fonts/InstrumentSerif-italic-400.woff2") format("woff2"); }
        @font-face { font-family: "Geist Mono"; font-style: normal; font-weight: 100 900; src: url("../../assets/fonts/GeistMono-normal-100-900.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; }
        /* The recording sits in a frame (209, 98, 1502 x 846); the rails use the margins either side. */
        #jo-frame { position: absolute; left: 207px; top: 96px; width: 1506px; height: 850px; border: 2px solid rgba(242,241,237,0.22); box-shadow: 0 30px 90px rgba(0,0,0,0.6); }
        .jo-rail { position: absolute; top: 150px; width: 168px; font-family: "Geist Mono", monospace; white-space: nowrap; }
        #jo-left { left: 28px; }
        #jo-right { right: 24px; }
        .jo-k { font-size: 13px; letter-spacing: 0.16em; color: #aaa9a7; margin-top: 26px; }
        .jo-v { margin-top: 6px; font-size: 17px; color: #f2f1ed; line-height: 24px; white-space: normal; width: 168px; }
        .jo-live { display: inline-flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; letter-spacing: 0.12em; color: #e8602c; }
        .jo-live i { width: 10px; height: 10px; border-radius: 50%; background: #e8602c; box-shadow: 0 0 12px 3px rgba(232,96,44,0.6); }
        #jo-speed { font-size: 30px; font-weight: 600; color: #e8602c; font-variant-numeric: tabular-nums; }
        #jo-stepn { font-family: "Instrument Serif", serif; font-style: italic; font-size: 64px; line-height: 64px; color: #e8602c; margin-top: 4px; }
        #jo-stept { margin-top: 10px; font-size: 16px; line-height: 23px; color: #f2f1ed; white-space: normal; width: 168px; }
        #jo-cut { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: flex; align-items: center; justify-content: center; background: #0e0e10; opacity: 0; }
        #jo-cut div { text-align: center; font-family: "Geist Mono", monospace; }
        #jo-cut b { display: block; font-size: 22px; letter-spacing: 0.3em; color: #e8602c; }
        #jo-cut span { display: block; margin-top: 14px; font-family: "Instrument Serif", serif; font-size: 64px; color: #f2f1ed; }
      </style>
      <div id="root" data-composition-id="judgesov" data-width="1920" data-height="1080">
        <div id="jo-frame" data-layout-ignore></div>
        <div class="jo-rail" id="jo-left">
          <div class="jo-live"><i></i>LIVE PRODUCT</div>
          <div class="jo-k">PAGE</div><div class="jo-v">the judges' start page, localhost</div>
          <div class="jo-k">MODEL</div><div class="jo-v">gpt-oss-120b<br />on Groq</div>
          <div class="jo-k">ARMORIQ</div><div class="jo-v">live enforcement</div>
          <div class="jo-k">SPEED</div><div class="jo-v" id="jo-speed">1×</div>
        </div>
        <div class="jo-rail" id="jo-right">
          <div class="jo-k" style="margin-top:0">STEP</div>
          <div id="jo-stepn">1</div>
          <div id="jo-stept">The damage</div>
        </div>
        <div id="jo-cut"><div><b>CUT</b><span id="jo-cut-text">The run finishes 53 seconds later.</span></div></div>
      </div>
      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          // Written by scripts/build.py from the take's marks: [scene time, step, label, playback rate].
          var SEGMENTS = /*SEGMENTS*/[[0.0, "1", "The damage", "1.18×"], [13.8, "2", "Undo it two ways", "1×"], [22.01, "2", "A live model works", "1.28×"], [31.6, "2", "ArmorIQ blocks the trap", "1×"], [36.4, "2", "Only the damage repaired", "1.71×"], [42.6, "3", "The agent prepares the change", "3.98×"], [46.7, "3", "You are the second key", "1.46×"], [53.2, "3", "Committed in one transaction", "1× · cut 5 s"], [56.4, "4", "Check our work", "1.34×"]]/*END*/;
          var CUT = /*CUT*/[35.6, 0.8]/*END*/;
          var LENGTH = /*LENGTH*/64.5/*END*/;
          tl.fromTo("#jo-frame", { opacity: 0, scale: 0.985 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 0);
          tl.fromTo(".jo-rail", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.1 }, 0.2);
          var n = document.getElementById("jo-stepn"), t = document.getElementById("jo-stept"), sp = document.getElementById("jo-speed"), st = { v: 0 };
          tl.to(st, { v: LENGTH, duration: LENGTH, ease: "none", onUpdate: function () {
            var k = 0; for (var i = 0; i < SEGMENTS.length; i++) if (st.v >= SEGMENTS[i][0]) k = i;
            n.textContent = SEGMENTS[k][1]; t.textContent = SEGMENTS[k][2]; sp.textContent = SEGMENTS[k][3];
          } }, 0);
          SEGMENTS.slice(1).forEach(function (s, i) {
            if (s[1] !== SEGMENTS[i][1]) tl.fromTo("#jo-stepn", { scale: 1.35 }, { scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, s[0]);
          });
          // The honest cut: the recording skips the rest of the model's run.
          tl.fromTo("#jo-cut", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none", immediateRender: false }, CUT[0]);
          tl.fromTo("#jo-cut span", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", immediateRender: false }, CUT[0] + 0.04);
          tl.to("#jo-cut", { opacity: 0, duration: 0.18, ease: "none" }, CUT[0] + CUT[1] - 0.18);
          window.__timelines["judgesov"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
