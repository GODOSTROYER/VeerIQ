      <script>
        (function () {
          var tl = gsap.timeline({ paused: true });
          function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
          var BLOCK = 3.75;

          // Entry: the zoom-out continues from the results board; the terminal flies up into place.
          tl.fromTo("#mq-world", { scale: 1.14, filter: "blur(12px)" }, { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0);
          tl.fromTo("#mq-kick", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "power3.out" }, 0.1);
          tl.fromTo("#mq-term", { y: 140, scale: 0.96, filter: "blur(10px)", opacity: 0 }, { y: 0, scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.55, ease: "power4.out" }, 0.15);
          tl.fromTo("#mq-glow", { opacity: 0 }, { opacity: 0.5, duration: 1.6, ease: "power2.out" }, 0.3);

          // The command types; the server spawns and lists its tools.
          var CMD = "python tasks.py demo-mcp-agent", l0 = document.getElementById("mq-l0"), ty = { v: 0 };
          function cmd(n) { l0.innerHTML = '<span class="p">$</span> <span class="c">' + CMD.substring(0, n) + "</span>"; }
          cmd(0);
          tl.to(ty, { v: CMD.length, duration: 0.6, ease: "power1.inOut", onUpdate: function () { cmd(Math.floor(ty.v)); } }, 0.35);
          gsap.set("#mq-body > *:not(#mq-l0), #mq-h3", { opacity: 0 });
          tl.fromTo("#mq-l1", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, 1.05);
          tl.fromTo("#mq-l2", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, 1.3);
          tl.set("#mq-tools", { opacity: 1 }, 1.4);
          tl.fromTo(".mq-t", { opacity: 0, scale: 0.6, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2)", stagger: 0.07, immediateRender: false }, 1.42);
          tl.fromTo("#mq-h1", { yPercent: 102 }, { yPercent: 0, duration: 0.6, ease: "power4.out" }, 2.0);
          tl.fromTo("#mq-sub", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.0);

          // ArmorIQ signs a plan of five; the sixth tool is outside it.
          tl.fromTo("#mq-l3", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, 2.25);
          tl.to(".mq-t:not(#mq-t5)", { borderColor: "rgba(255,148,103,0.75)", duration: 0.2, ease: "power2.out", stagger: 0.04 }, 2.3);
          tl.to("#mq-t5", { color: "#ffa185", borderColor: "rgba(255,161,133,0.5)", textDecoration: "line-through", opacity: 0.85, duration: 0.15, ease: "none" }, 2.55);
          tl.fromTo("#mq-h2", { yPercent: 102 }, { yPercent: 0, duration: 0.6, ease: "expo.out" }, 2.6);

          // Every action is an MCP tools/call; each verdict arrives from ArmorIQ.
          var CALLS = [2.95, 3.35, BLOCK, 4.25, 4.6, 4.95];
          CALLS.forEach(function (t, i) {
            var id = "#mq-c" + i;
            tl.fromTo(id, { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.18, ease: "power2.out", immediateRender: false }, t);
            tl.fromTo(id + " .mq-tag", { scale: i === 2 ? 1.7 : 1.3, opacity: 0 }, { scale: 1, opacity: 1, duration: i === 2 ? 0.18 : 0.14, ease: "expo.out", immediateRender: false }, t + 0.12);
            tl.fromTo(id + " .mq-src", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none", immediateRender: false }, t + 0.18);
          });

          // The refusal: one flash, the frame flares, the line shudders, the verdict lands on the left.
          tl.fromTo("#mq-flash", { opacity: 0 }, { opacity: 0.22, duration: 0.03, ease: "none", immediateRender: false }, BLOCK + 0.12);
          tl.to("#mq-flash", { opacity: 0, duration: 0.3, ease: "power2.out" }, BLOCK + 0.15);
          tl.fromTo("#mq-term", { borderColor: "rgba(242,241,237,0.16)" }, { borderColor: "rgba(232,96,44,0.95)", duration: 0.08, ease: "none", immediateRender: false }, BLOCK + 0.12);
          tl.to("#mq-term", { borderColor: "rgba(242,241,237,0.16)", duration: 0.9, ease: "power2.out" }, BLOCK + 0.3);
          tl.to("#mq-glow", { opacity: 1, duration: 0.1, ease: "none" }, BLOCK + 0.12);
          tl.to("#mq-glow", { opacity: 0.5, duration: 1.2, ease: "power2.out" }, BLOCK + 0.22);
          var sh = { a: 0 };
          tl.fromTo(sh, { a: 1 }, { a: 0, duration: 0.4, ease: "power2.out", immediateRender: false, onUpdate: function () {
            var k = Math.floor(tl.time() * 30);
            document.getElementById("mq-c2").style.transform = "translateX(" + ((hash(k * 3 + 1) * 2 - 1) * 12 * sh.a).toFixed(1) + "px)";
          } }, BLOCK + 0.12);
          tl.set("#mq-c2", { x: 0 }, BLOCK + 0.53);
          tl.fromTo("#mq-h3", { opacity: 0, scale: 1.25, filter: "blur(14px)", transformOrigin: "0% 70%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.22, ease: "expo.out", immediateRender: false }, BLOCK + 0.14);

          // The run completes: one commit, nothing forbidden, live enforcement.
          tl.fromTo("#mq-sum", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, 5.4);
          tl.fromTo("#mq-fin", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out", immediateRender: false }, 5.65);
          tl.fromTo("#mq-fin .mq-okbig", { boxShadow: "0 0 0px 0px rgba(163,204,179,0)" }, { boxShadow: "0 0 26px 6px rgba(163,204,179,0.55)", duration: 0.12, ease: "none", immediateRender: false }, 5.65);
          tl.to("#mq-fin .mq-okbig", { boxShadow: "0 0 0px 0px rgba(163,204,179,0)", duration: 0.7, ease: "power2.out" }, 5.77);
          tl.fromTo("#mq-cmd", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.9);
          tl.fromTo("#mq-src", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "none" }, 6.1);

          // Ambient: one slow push; then the zoom-out hands off to the workspace.
          tl.fromTo("#mq-world", { scale: 1 }, { scale: 1.02, duration: 7.2, ease: "sine.inOut", immediateRender: false }, 0.5);
          tl.fromTo("#mq-world", { filter: "blur(0px)" }, { scale: 0.86, filter: "blur(12px)", duration: 0.25, ease: "power3.in", immediateRender: false }, 7.75);


          // Demo cut: retimed to the narration. ANCHORS map this scene's authored clock (left) to the
          // narration clock (right). Starts follow the map; durations follow the local slope, clamped so
          // pops stay snappy and holds do not crawl.
          var ANCHORS = [[0, 0], [1.3, 2.4], [2.0, 6.2], [2.25, 7.4], [2.6, 7.9], [2.95, 8.15], [3.75, 8.9], [4.95, 9.9], [5.4, 10.3], [5.9, 11.0], [7.75, 12.35], [8, 12.6]];
          function T(t) {
            for (var i = 1; i < ANCHORS.length; i++) {
              if (t <= ANCHORS[i][0]) { var a = ANCHORS[i - 1], b = ANCHORS[i]; return a[1] + (t - a[0]) * (b[1] - a[1]) / (b[0] - a[0]); }
            }
            var l = ANCHORS[ANCHORS.length - 1]; return l[1] + (t - l[0]);
          }
          tl.getChildren(false, true, true).forEach(function (c) {
            var s0 = c.startTime(), d0 = c.duration(), s1 = T(s0);
            if (d0 > 0) { var k = (T(s0 + d0) - s1) / d0; c.duration(d0 * Math.max(0.7, Math.min(k, 1.6))); }
            c.startTime(s1);
          });

          window.__timelines["mcplive"] = tl;
        })();
      </script>
